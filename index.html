<style>
/* Layout: a single reading column, quiet masthead, ruled poem list; verses set as two hemistichs across the page centre. */
:root{
  --bg:#f3f1ec; --surface:#fbfaf6; --ink:#1c2233; --muted:#5d6577; --line:#d9d5ca; --tint:#e8ebf3;
  --accent:#233a6e; --on-accent:#ffffff; --gold:#97721d; --danger:#a13434;
  --f-display:'Aref Ruqaa','Amiri',serif; --f-verse:'Amiri','Traditional Arabic',serif; --f-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#161d2e; --ink:#e8eaf2; --muted:#9aa3b8; --line:#283149; --tint:#1b2440;
  --accent:#8fa9e8; --on-accent:#0b1020; --gold:#d9b663; --danger:#ee9a9a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#161d2e; --ink:#e8eaf2; --muted:#9aa3b8; --line:#283149; --tint:#1b2440;
  --accent:#8fa9e8; --on-accent:#0b1020; --gold:#d9b663; --danger:#ee9a9a; color-scheme:dark}
html{direction:rtl}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:20px 110px}
#app{max-width:860px;margin-inline:auto;direction:rtl;text-align:start}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:clamp(2.2rem,7vw,3.4rem);line-height:1.3;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:start}
.mast-tools{display:flex;gap:8px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);font-size:.9rem}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
.orn{display:flex;align-items:center;gap:12px;margin-block:4px 18px;color:var(--gold)}
.orn::before,.orn::after{content:"";height:1px;flex:1;background:linear-gradient(to var(--d,left),var(--gold),transparent);opacity:.7}
.orn::after{--d:right}
.orn i{width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.sub{color:var(--muted);font-size:.95rem;margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-block:18px 14px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--gold)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.bar .grow{flex:1 1 220px;min-width:0}
input[type=text],input[type=search],input[type=email],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0}
textarea{font-family:var(--f-verse);font-size:1.2rem;line-height:2;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.sm{padding:5px 12px;font-size:.9rem}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px;margin-block:8px;font-size:.92rem}
.chip button{border:0;background:var(--line);border-radius:50%;width:22px;height:22px;cursor:pointer;color:var(--ink)}
.list{margin:0;padding:0;list-style:none}
.row{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 2px;cursor:pointer}
.row:hover .rt{color:var(--accent)}
.rt{font-family:var(--f-verse);font-weight:700;font-size:1.45rem;line-height:1.5;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.star{color:var(--gold);font-size:1rem}
.badge{font-family:var(--f-ui);font-size:.72rem;font-weight:500;border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:0 6px}
.rm{color:var(--muted);font-size:.88rem}
.rx{font-family:var(--f-verse);color:var(--muted);font-size:1.12rem;margin-top:2px}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.empty .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.poets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 24px}
.poets .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pn{font-family:var(--f-verse);font-weight:700;font-size:1.3rem}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 0;margin-bottom:6px}
.ptitle{font-family:var(--f-display);font-size:clamp(2rem,6vw,3rem);line-height:1.45;color:var(--accent);margin:6px 0 2px;text-wrap:balance}
.pmeta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:.92rem;margin:0 0 4px}
.pmeta b{color:var(--ink);font-weight:600}
.verses{margin-block:8px 20px;padding-block:6px}
.v{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;column-gap:clamp(2rem,9vw,5rem);padding-block:.2rem;font-family:var(--f-verse);font-size:calc(clamp(1.3rem,3.4vw,1.75rem) * var(--fz,1));line-height:var(--flh,2.1)}
.v .s,.v .j{text-align:center}
.v.one{grid-template-columns:1fr}
.v.one .s{text-align:center}
.acts-row{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.form{display:grid;gap:14px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f,div.f{display:grid;gap:4px;font-size:.9rem;color:var(--muted);min-width:0}
h2.h{font-family:var(--f-display);font-size:1.9rem;color:var(--accent);margin:8px 0 12px;font-weight:400}
.hint{color:var(--muted);font-size:.88rem;margin:0}
.imp-item{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;display:grid;gap:10px;margin-bottom:14px}
.imp-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.box{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px;margin-bottom:16px;display:grid;gap:10px}
.box h3{margin:0;font-size:1.05rem}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 18px;font-size:.92rem;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:40}
#toast.on{opacity:1;transform:none}
.warn{border:1px solid var(--gold);color:var(--muted);border-radius:8px;padding:8px 12px;font-size:.9rem;margin-top:10px}
.usr.on{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.sq{width:42px;height:42px;padding:0;display:inline-grid;place-items:center;font-size:1.15rem;line-height:1}
.votd{background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;margin-block:14px 6px;text-align:center}
.votd small{display:block;color:var(--gold);font-weight:600;letter-spacing:.04em;margin-bottom:2px}
.votd .v{font-size:clamp(1.15rem,3vw,1.5rem)}
.votd-foot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.9rem}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.fabwrap{position:fixed;inset-inline-end:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:5}
.fab{border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);padding:13px 22px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:1rem}
.fab-menu{display:none;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.2)}
.fabwrap.open .fab-menu{display:flex}
.fab-menu .btn{justify-content:flex-start;border-color:transparent;color:var(--ink);padding:10px 14px;width:100%}
.fab-menu .btn:hover{background:var(--tint);filter:none}
.count{color:var(--muted);font-size:.88rem;margin:6px 2px}
.tools-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.nav2 .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis}
.verses .v{font-size:calc(clamp(1.3rem,3.4vw,1.75rem) * var(--fs,1) * var(--fz,1))}
.bulk{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:16px;padding:12px;border:1px dashed var(--gold);border-radius:10px}
.prev{border:1px dashed var(--line);border-radius:10px;padding:6px 10px;max-height:340px;overflow:auto;background:var(--surface);color:var(--ink);margin-top:4px}
.prev .v{font-size:1.15rem;line-height:1.9;column-gap:2rem}
.row.file{position:relative;overflow:hidden}
.row.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.mrow{display:flex;align-items:center;gap:14px}
.mrow svg{width:22px;height:22px;fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:8px 10px}
.tg{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:.9rem}
.tg:hover{color:var(--ink);border-color:var(--muted)}
.tg[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ptags{display:flex;gap:8px;flex-wrap:wrap;margin-block:6px 2px}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg .tg{padding:2px 10px;font-size:.85rem}
.notes{border-top:1px solid var(--line);padding-block:12px 4px;margin-bottom:6px}
.notes h3{margin:0 0 4px;font-size:.95rem;color:var(--gold);font-weight:600}
.notes p{margin:0;color:var(--ink)}
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:4px 18px;margin:0}
.gloss dt{font-family:var(--f-verse);font-weight:700;font-size:1.15rem}
.gloss dd{margin:0;color:var(--muted)}
.loading{padding:60px 8px;text-align:center;color:var(--muted)}
.reader{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));direction:rtl}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rtitle{font-family:var(--f-display);color:var(--accent);font-size:1.3rem;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtools{display:flex;gap:6px}
.rbody{display:grid;place-items:center;overflow-y:auto;padding-block:12px}
.rv{text-align:center;font-family:var(--f-verse);font-size:calc(clamp(1.9rem,7vw,3.2rem) * var(--fs,1) * var(--fz,1));line-height:var(--flh,2.1);max-width:900px;animation:rin .3s ease}
.rorn{display:flex;justify-content:center;margin-block:.15em}
.rorn i{width:9px;height:9px;background:var(--gold);transform:rotate(45deg)}
.rbot{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:900px;width:100%;margin-inline:auto;color:var(--muted)}
@keyframes rin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#bnav{display:none}
@media (max-width:620px){
  .bulk{grid-template-columns:1fr}
  .v{grid-template-columns:minmax(0,1fr);column-gap:0}
  .v .s{text-align:start}.v .j{text-align:end;padding-inline-start:14%}
  .v.one .s{text-align:center}
  .form .two{grid-template-columns:1fr}
  .rv .v{display:block}
  #bnav{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);border-radius:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 18px rgba(10,20,50,.12);z-index:50;transform:translateZ(0)}
  #toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #bnav button{position:relative;background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 0 5px;border-radius:14px;color:var(--muted);font-size:.74rem;cursor:pointer;min-width:0;transition:background .2s,color .2s}
  #bnav button[aria-current="page"]{color:var(--accent);font-weight:600;background:var(--tint)}
  #bnav button[aria-current="page"]::before{content:"";position:absolute;top:-8px;inset-inline:32%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
  #bnav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #bnav button[data-nav="search"]{margin-top:-28px;background:none;color:var(--accent);font-weight:600}
  #bnav button[data-nav="search"]::before{display:none}
  #bnav button[data-nav="search"] svg{width:54px;height:54px;padding:14px;border-radius:50%;background:var(--accent);stroke:var(--on-accent);border:3px solid var(--bg);box-shadow:0 6px 16px rgba(0,0,0,.28)}
  #bnav button[data-nav="search"][aria-current="page"] svg{box-shadow:0 0 0 2px var(--gold),0 6px 16px rgba(0,0,0,.28)}
  #bnav .nb{position:absolute;top:0;inset-inline-start:calc(50% + 5px);font-style:normal;font-size:.62rem;line-height:1;font-weight:600;background:var(--gold);color:var(--on-accent);border-radius:999px;padding:2px 5px;min-width:16px;text-align:center}
  .tabs{display:none}
  .fabwrap{bottom:calc(98px + env(safe-area-inset-bottom,0px))}
  body{padding-block-end:170px}
  #toast{bottom:calc(106px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.rv{animation:none}}

/* ---- v2: share, theme icon, motion ---- */
.vw{position:relative;padding-inline:34px}
.shv{position:absolute;inset-inline-end:0;top:50%;transform:translateY(-50%);width:32px;height:32px;display:grid;place-items:center;border-radius:50%;border:0;background:none;color:var(--muted);opacity:.4;cursor:pointer;transition:opacity .2s,background .2s,color .2s}
.vw:hover .shv,.shv:focus-visible{opacity:1}.shv:hover{background:var(--tint);color:var(--accent)}
@media (hover:none){.shv{opacity:.55}}
.tico{display:inline-block;font-size:1.2rem;line-height:1;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.sq:hover .tico{transform:rotate(25deg) scale(1.12)}
.tico.sun{animation:tspin .6s ease}.tico.moon{animation:tpop .5s ease}
@keyframes tspin{from{transform:rotate(-120deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes tpop{from{transform:scale(.3) rotate(40deg);opacity:0}to{transform:none;opacity:1}}
.usr svg{transition:transform .3s}.usr.on svg{transform:none}
.votd{position:relative;background:linear-gradient(160deg,var(--tint),var(--surface));border-color:var(--gold);padding:20px 16px 14px;box-shadow:0 8px 24px rgba(10,20,50,.08)}
.votd small{font-family:var(--f-display);font-size:1.15rem;margin-bottom:6px}
.rprog{height:3px;background:var(--line);border-radius:3px;overflow:hidden;max-width:900px;width:100%;margin-inline:auto}
.rprog i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
#shov{position:fixed;inset:0;z-index:90;background:rgba(5,8,18,.82);display:grid;place-items:center;padding:16px;animation:fin .2s ease}
.shbox{background:var(--surface);border-radius:16px;padding:14px;max-width:min(94vw,460px);max-height:94vh;overflow:auto;text-align:center;display:grid;gap:10px}
.shbox img{width:100%;height:auto;max-height:68vh;object-fit:contain;border-radius:10px}
.shacts{display:flex;gap:8px;justify-content:center}.shbox small{color:var(--muted)}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#app.vin{animation:vin .35s ease}
#app.vin #listbox li,#app.vin .vw{animation:rin .45s ease both;animation-delay:calc(var(--d,0)*45ms)}
#app.vin #listbox li:nth-child(1){--d:1}
#app.vin #listbox li:nth-child(2){--d:2}
#app.vin #listbox li:nth-child(3){--d:3}
#app.vin #listbox li:nth-child(4){--d:4}
#app.vin #listbox li:nth-child(5){--d:5}
#app.vin #listbox li:nth-child(6){--d:6}
#app.vin #listbox li:nth-child(7){--d:7}
#app.vin #listbox li:nth-child(8){--d:8}
#app.vin #listbox li:nth-child(9){--d:9}
#app.vin #listbox li:nth-child(10){--d:10}
#app.vin #listbox li:nth-child(11){--d:11}
#app.vin #listbox li:nth-child(12){--d:12}
.row{border-radius:8px;transition:background .2s,padding .2s}
.row:hover{background:var(--tint);padding-inline:12px}
.btn,.icon-btn,.fab{transition:transform .15s,background .2s,box-shadow .2s}
.btn:active,.icon-btn:active,.fab:active{transform:scale(.96)}
.votd{animation:rin .5s ease}
@media (prefers-reduced-motion:reduce){#app.vin,#app.vin *,.tico,.votd,#shov{animation:none!important}.row,.btn,.icon-btn{transition:none}}
.rmid{display:grid;justify-items:center;line-height:1.4}.rhint{font-size:.7rem;opacity:.7;text-align:center}
.rv.nx{animation:rnx .28s ease}.rv.pv{animation:rpv .28s ease}
@keyframes rnx{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes rpv{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
.rbody{cursor:pointer;user-select:none;-webkit-user-select:none}
.v .s,.v .j{overflow-wrap:break-word;min-width:0}
.vw{contain:layout}
.sgrp{font-size:.8rem;color:var(--gold);font-weight:600;letter-spacing:.05em;margin:18px 2px 2px}
.sval{margin-inline-start:auto;color:var(--muted);font-size:.9rem;font-family:var(--f-ui);font-weight:400}
.mrow{width:100%}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:default}
.setrow:hover{background:none;padding-inline:2px}

<nav id="bnav" aria-label="التنقل"></nav>

<script>
(function(){
var KEY='diwan-v1', THEME='diwan-theme';
var BAHRS=['الطويل','المديد','البسيط','الوافر','الكامل','الهزج','الرجز','الرمل','السريع','المنسرح','الخفيف','المضارع','المقتضب','المجتث','المتقارب','المتدارك','شعر التفعيلة','نبطي'];
var DEFAULT_TAGS=['غزل','رثاء','حكمة','وطنيات','مدح','فخر','وصف','زهد ودين','اجتماعيات'];
var SECT={diwan:'ديواني',fav:'المفضلة'};
document.documentElement.dir='rtl';document.documentElement.lang='ar';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var num=function(n){return Number(n).toLocaleString('ar-EG')};
var uid=function(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var norm=function(s){return String(s||'').replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase()};

var SAMPLE={id:'sample1',title:'على قدر أهل العزم',poet:'المتنبي',section:'fav',star:true,sample:true,bahr:'الطويل',qafiya:'الميم',era:'العصر العباسي',source:'',tags:['حكمة','فخر'],occasion:'',gloss:'',
 verses:[['عَلى قَدرِ أَهلِ العَزمِ تَأتي العَزائِمُ','وَتَأتي عَلى قَدرِ الكِرامِ المَكارِمُ'],['وَتَعظُمُ في عَينِ الصَغيرِ صِغارُها','وَتَصغُرُ في عَينِ العَظيمِ العَظائِمُ']],created:0};
function freshData(){return {poems:[],settings:{site:'ديواني',author:''}}}

var storageOk=true;
function canE(){return S.canEdit}
function isO(){return S.isOwner}
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.poems)){d.settings=d.settings||{};return d}}}catch(e){storageOk=false}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S.data));storageOk=true}catch(e){storageOk=false}}
function peekLocal(){var d=load();if(!d)return null;var l=d.poems.filter(function(p){return !p.sample&&p.id!=='sample1'});return l.length?{poems:l,settings:d.settings}:null}

var S={data:freshData(),mode:'',ready:false,canEdit:false,isOwner:false,err:'',tab:'home',q:'',bahr:'',tag:'',poet:'',sort:'new',view:'list',cur:null,edit:null,imp:[],confirm:false,msg:'',fs:1,votd:null,tash:true,ri:0};
var FONTS=[['أميري',"'Amiri','Traditional Arabic',serif",1,2.1],['نسخ',"'Noto Naskh Arabic','Amiri',serif",.9,2.3],['شهرزاد',"'Scheherazade New','Amiri',serif",.94,2.2],['رقعة',"'Aref Ruqaa','Amiri',serif",.8,2.4]];S.fi=0;
try{var fi0=parseInt(localStorage.getItem('diwan-font'));if(fi0>=0&&fi0<FONTS.length)S.fi=fi0}catch(e){}
function applyFont(){var r=document.documentElement.style,F=FONTS[S.fi];r.setProperty('--f-verse',F[1]);r.setProperty('--fz',F[2]);r.setProperty('--flh',F[3])}applyFont();
function isDark(){var r=document.documentElement;return r.dataset.theme?r.dataset.theme==='dark':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
try{var fsv=parseFloat(localStorage.getItem('diwan-fs'));if(fsv>=0.8&&fsv<=1.6)S.fs=fsv;if(localStorage.getItem('diwan-tash')==='0')S.tash=false}catch(e){}
try{var th=localStorage.getItem(THEME);if(th)document.documentElement.dataset.theme=th}catch(e){}

function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},2600)}
function fail(){toast('تعذر الحفظ، حاول مرة أخرى')}

/* ---------- persistence (account db, or this browser as fallback) ---------- */
function cleanPoem(p){return {title:p.title||'',poet:p.poet||'',section:p.section==='fav'?'fav':'diwan',star:!!p.star,bahr:p.bahr||'',qafiya:p.qafiya||'',era:p.era||'',source:p.source||'',tags:(p.tags||[]).slice(0,20),occasion:p.occasion||'',gloss:p.gloss||'',verses:(p.verses||[]).map(function(v){return [v[0]||'',v[1]||'']}),created:p.created||Date.now(),sample:!!p.sample}}
function normPoem(x,id){var p=cleanPoem(x);p.id=id||x.id;if(!p.sample)delete p.sample;return p}
var sb=null, fetchT=null;
function rowOf(p){var r=cleanPoem(p);r.id=p.id;return r}
function chk(r){if(r&&r.error)throw r.error;return r}
function persistPoem(p){if(S.mode==='supa')return sb.from('poems').upsert(rowOf(p)).then(chk);save();return Promise.resolve()}
function removePoem(id){if(S.mode==='supa')return sb.from('poems').delete().eq('id',id).then(chk);save();return Promise.resolve()}
function persistSettings(){if(S.mode==='supa')return sb.from('settings').upsert({id:1,site:S.data.settings.site||'ديواني',author:S.data.settings.author||''}).then(chk);save();return Promise.resolve()}
function addMany(list){
  if(S.mode!=='supa'){list.forEach(function(p){S.data.poems.push(p)});save();return Promise.resolve()}
  return sb.from('poems').upsert(list.map(rowOf)).then(chk).then(fetchPoems);
}
function fetchPoems(){return sb.from('poems').select('*').then(chk).then(function(r){S.data.poems=(r.data||[]).map(function(x){return normPoem(x,x.id)})})}
function fetchSettings(){return sb.from('settings').select('*').eq('id',1).maybeSingle().then(chk).then(function(r){var x=r.data;if(x)S.data.settings={site:x.site||'ديواني',author:x.author||''}})}
function loadRole(session){
  S.canEdit=false;S.isOwner=false;S.email='';
  if(!session||!session.user)return Promise.resolve();
  S.email=session.user.email||'';
  return sb.from('staff').select('role').eq('user_id',session.user.id).maybeSingle().then(function(r){
    var role=r&&r.data&&r.data.role;S.canEdit=!!role;S.isOwner=role==='owner';
  },function(){});
}
function roleKey(){return [S.canEdit,S.isOwner,S.email].join('|')}
function refreshRole(){
  var before=roleKey();
  return sb.auth.getSession().then(function(r){return loadRole(r.data&&r.data.session)}).then(function(){
    if(S.ready&&roleKey()!==before&&S.view!=='edit'&&S.view!=='import'&&S.view!=='tools')render(true);
  });
}
function startLocal(){
  S.mode='local';S.canEdit=true;S.isOwner=true;
  S.data=load()||{poems:[SAMPLE],settings:{site:'ديواني',author:''}};
  S.data.settings.site=S.data.settings.site||'ديواني';
  try{if(localStorage.getItem(KEY)===null)save()}catch(e){storageOk=false}
  S.ready=true;route();render();
}
function boot(){
  var c=window.DIWAN_CONFIG||{};
  if(!c.SUPABASE_URL||!c.SUPABASE_ANON_KEY||!window.supabase){startLocal();return}
  try{sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY)}catch(e){startLocal();return}
  S.mode='supa';
  sb.auth.getSession().then(function(r){return loadRole(r.data&&r.data.session)})
    .then(function(){return Promise.all([fetchPoems(),fetchSettings()])})
    .then(function(){S.ready=true;route();render();watch()})
    .catch(function(){S.err='error';S.ready=true;render()});
  sb.auth.onAuthStateChange(function(ev){
    if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')setTimeout(refreshRole,0);
  });
}
function watch(){
  var later=function(){clearTimeout(fetchT);fetchT=setTimeout(function(){Promise.all([fetchPoems(),fetchSettings()]).then(softRefresh).catch(function(){})},500)};
  try{sb.channel('diwan').on('postgres_changes',{event:'*',schema:'public',table:'poems'},later).on('postgres_changes',{event:'*',schema:'public',table:'settings'},later).subscribe()}catch(e){}
  document.addEventListener('visibilitychange',function(){if(!document.hidden)later()});
}
function doLogin(){
  var email=val('l-email'),pw=($('#l-pass')||{}).value||'';
  if(!email||!pw){toast('اكتب البريد الإلكتروني وكلمة المرور');return}
  var btn=$('#l-btn');if(btn)btn.disabled=true;
  sb.auth.signInWithPassword({email:email,password:pw}).then(function(r){
    if(r.error){if(btn)btn.disabled=false;toast('بيانات الدخول غير صحيحة');return}
    return loadRole(r.data&&r.data.session).then(function(){
      S.view='list';render();
      toast(S.canEdit?'مرحبًا بك في وضع المدير':'هذا الحساب لا يملك صلاحية الإدارة');
    });
  }).catch(function(){if(btn)btn.disabled=false;toast('تعذر تسجيل الدخول، حاول مرة أخرى')});
}
function logout(){
  var done=function(){S.canEdit=false;S.isOwner=false;S.email='';S.confirm=false;S.view='list';render();toast('تم تسجيل الخروج')};
  sb.auth.signOut().then(done,done);
}
function softRefresh(){
  var a=document.activeElement,typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if(S.view==='list'){if(typing){renderList();renderNav()}else render(true)}
  else if(S.view==='poem'){if(!S.data.poems.some(function(x){return x.id===S.cur}))S.view='list';render(true)}
  else if(S.view==='more'){render(true)}
  else renderNav();
}

/* ---------- verses <-> text ---------- */
var SEP=/\s*(?:\.{2,}|…|\t| {2,}|\s{3,}|\*{1,3}|[-–—]{2,})\s*/;
function plain(s){return String(s).replace(/[ً-ٰٟـ]/g,'')}
function hasTash(p){return p.verses.some(function(v){return /[ً-ٰٟ]/.test(v[0]+v[1])})}
function splitMid(l){
  var w=l.trim().split(/\s+/);if(w.length<2)return [l.trim(),''];
  var tot=plain(l).length,acc=0,best=1,bd=1e9;
  for(var i=1;i<w.length;i++){acc+=plain(w[i-1]).length+1;var d=Math.abs(acc-(tot-acc));if(d<bd){bd=d;best=i}}
  return [w.slice(0,best).join(' '),w.slice(best).join(' ')];
}
function buildVerses(lines,mode){
  lines=lines.map(function(l){return l.trim()}).filter(Boolean);
  if(!mode||mode==='auto'){
    if(lines.some(function(l){return SEP.test(l)}))mode='sep';
    else{var avg=lines.reduce(function(a,l){return a+plain(l).length},0)/(lines.length||1);mode=avg<=38?'pair':'split'}
  }
  var out=[],i;
  if(mode==='pair'){for(i=0;i<lines.length;i+=2)out.push([lines[i],lines[i+1]||''])}
  else if(mode==='split'){out=lines.map(splitMid)}
  else{lines.forEach(function(l){var p=l.split(SEP).filter(Boolean);out.push(p.length>1?[p[0],p.slice(1).join(' ')]:[l,''])})}
  return out;
}
function parseVerses(text,mode){return buildVerses(String(text).split('\n'),mode)}
var SHARE_SVG='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M20 16l-5-5-8 8"/></svg>';
function versesHtml(vs,strip,share){
  var t=function(x){return esc(strip?plain(x):x)};
  return vs.map(function(v,i){
    var h=v[1]?'<div class="v"><span class="s">'+t(v[0])+'</span><span class="j">'+t(v[1])+'</span></div>':'<div class="v one"><span class="s">'+t(v[0])+'</span></div>';
    return share?'<div class="vw" style="--d:'+Math.min(i,14)+'">'+h+'<button class="shv" data-act="shv" data-i="'+i+'" title="مشاركة البيت كصورة" aria-label="مشاركة البيت كصورة">'+SHARE_SVG+'</button></div>':h;
  }).join('');
}
var MODES=[['auto','تلقائي (يُنصح به)'],['pair','شطر في كل سطر'],['split','بيت كامل في كل سطر'],['sep','بفاصل (... أو *)']];
function modeOpts(cur){return MODES.map(function(m){return '<option value="'+m[0]+'"'+(cur===m[0]?' selected':'')+'>'+m[1]+'</option>'}).join('')}
function verseText(v){return v.map(function(x){return x[1]?x[0]+' ... '+x[1]:x[0]}).join('\n')}
function poetLabel(p){return p.poet||(p.section==='diwan'?(S.data.settings.author||''):'')}
function parseTags(s){var out=[];String(s||'').split(/[,،;؛]/).forEach(function(t){t=t.trim();if(t&&out.indexOf(t)<0)out.push(t)});return out}
function allTags(){var l=DEFAULT_TAGS.slice();S.data.poems.forEach(function(p){(p.tags||[]).forEach(function(t){if(l.indexOf(t)<0)l.push(t)})});return l}
function parseGloss(s){return String(s||'').split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l){var m=l.match(/^(.+?)\s*[:：]\s*(.+)$/);return m?[m[1],m[2]]:[l,'']})}
function notesHtml(p){
  var h='';
  if(p.occasion)h+='<section class="notes"><h3>مناسبة النظم</h3><p>'+esc(p.occasion)+'</p></section>';
  var g=parseGloss(p.gloss);
  if(g.length)h+='<section class="notes"><h3>معاني الكلمات</h3><dl class="gloss">'+g.map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>'}).join('')+'</dl></section>';
  return h;
}

/* ---------- Word -> poems ---------- */
function parseDocx(html,fname){
  var doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');
  var els=[].slice.call(doc.body.firstChild.children);
  var hasH=els.some(function(e){return /^H[1-6]$/.test(e.tagName)});
  var isBold=function(e){return e.tagName==='P'&&e.children.length===1&&e.firstElementChild.tagName==='STRONG'&&e.textContent.trim()===e.firstElementChild.textContent.trim()&&!SEP.test(e.textContent.trim())};
  var ps=els.filter(function(e){return e.tagName==='P'&&e.textContent.trim()});
  var boldCount=ps.filter(isBold).length;
  var useBold=!hasH&&boldCount>0&&boldCount<ps.length*0.5;
  var poems=[],cur=null;
  var start=function(title){cur={title:title,lines:[]};poems.push(cur)};
  els.forEach(function(el){
    var c=el.cloneNode(true);c.querySelectorAll('br').forEach(function(b){b.replaceWith('\n')});
    var text=c.textContent;
    if(/^H[1-6]$/.test(el.tagName)){if(text.trim())start(text.trim());return}
    if(useBold&&isBold(el)){start(text.trim());return}
    text.split('\n').forEach(function(line){
      var t=line.trim();if(!t)return;
      if(!cur)start(fname.replace(/\.[^.]+$/,''));
      cur.lines.push(t);
    });
  });
  return poems.filter(function(p){return p.lines.length}).map(function(p){return {title:p.title,raw:p.lines,verses:buildVerses(p.lines,'auto')}});
}

/* ---------- filtering ---------- */
function scopeList(){
  var list=S.data.poems.slice();
  if(S.tab==='diwan')list=list.filter(function(p){return p.section==='diwan'});
  else if(S.tab==='fav')list=list.filter(function(p){return p.section==='fav'});
  else if(S.tab==='poets'&&S.poet)list=list.filter(function(p){return poetLabel(p)===S.poet});
  return list;
}
function visible(){
  var q=norm(S.q),list=scopeList();
  if(S.bahr)list=list.filter(function(p){return p.bahr===S.bahr});
  if(S.tag)list=list.filter(function(p){return (p.tags||[]).indexOf(S.tag)>-1});
  if(q)list=list.filter(function(p){return norm([p.title,poetLabel(p),p.bahr,(p.tags||[]).join(' '),p.verses.map(function(v){return v[0]+' '+v[1]}).join(' ')].join(' ')).indexOf(q)>-1});
  list.sort(function(a,b){var st=(b.star?1:0)-(a.star?1:0);if(st)return st;return S.sort==='title'?a.title.localeCompare(b.title,'ar'):(b.created||0)-(a.created||0)});
  return list;
}
function rowHtml(p){
  var first=p.verses[0]?(p.verses[0][0]+(p.verses[0][1]?' … '+p.verses[0][1]:'')):'';
  var meta=[(S.tab==='home'||S.tab==='search')?SECT[p.section]:'',poetLabel(p),p.bahr].filter(Boolean).join(' · ');
  return '<li><button class="row" data-act="open" data-id="'+p.id+'"><div class="rt">'+(p.star?'<span class="star" title="مميزة">★</span>':'')+esc(p.title)+(p.sample?'<span class="badge">مثال</span>':'')+'</div>'+(meta?'<div class="rm">'+esc(meta)+'</div>':'')+'<div class="rx">'+esc(plain(first))+'</div></button></li>';
}
function poetsHtml(){
  var m={};S.data.poems.forEach(function(p){var n=poetLabel(p)||'شاعر غير مذكور';(m[n]=m[n]||[]).push(p)});
  var names=Object.keys(m).sort(function(a,b){return a.localeCompare(b,'ar')});
  if(!names.length)return '<div class="empty">لا يوجد شعراء بعد.</div>';
  return '<div class="poets">'+names.map(function(n){return '<button class="row" data-act="poet" data-poet="'+esc(n)+'"><span class="pn">'+esc(n)+'</span><span class="rm">'+num(m[n].length)+' قصيدة</span></button>'}).join('')+'</div>';
}
function listHtml(){
  if(S.tab==='poets'&&!S.poet)return poetsHtml();
  if(S.tab==='search'&&!S.q&&!S.bahr&&!S.tag)return '<div class="empty">اكتب كلمة من العنوان أو اسم الشاعر أو من الأبيات.</div>';
  var l=visible();
  if(!l.length){
    if(S.q||S.bahr||S.tag)return '<div class="empty">لا توجد قصيدة تطابق البحث.</div>';
    var sec=S.tab==='fav'?'fav':'diwan';
    if(!canE())return '<div class="empty">لا توجد قصائد هنا بعد.</div>';
    return '<div class="empty"><p>'+(sec==='diwan'?'ديوانك فارغ حتى الآن.':'لم تحفظ قصائد مفضلة بعد.')+'<br>أضف قصيدة بيدك أو ارفع ملف Word.</p><div class="acts"><button class="btn primary" data-act="add">إضافة قصيدة</button><label class="btn file">رفع ملف Word<input type="file" accept=".docx" data-file="1" id="f-empty"></label></div></div>';
  }
  return ((S.q||S.bahr||S.tag)?'<p class="count">'+num(l.length)+' نتيجة</p>':'')+'<ul class="list">'+l.map(rowHtml).join('')+'</ul>';
}
function chipsHtml(){
  if(S.tab==='poets')return '';
  var m={};scopeList().forEach(function(p){(p.tags||[]).forEach(function(t){m[t]=(m[t]||0)+1})});
  var names=Object.keys(m).sort(function(a,b){return m[b]-m[a]||a.localeCompare(b,'ar')});
  if(!names.length)return '';
  return '<div class="chips" role="group" aria-label="الموضوعات"><button class="tg" aria-pressed="'+(!S.tag)+'" data-act="tag" data-tag="">الكل</button>'+names.map(function(t){return '<button class="tg" aria-pressed="'+(S.tag===t)+'" data-act="tag" data-tag="'+esc(t)+'">'+esc(t)+' · '+num(m[t])+'</button>'}).join('')+'</div>';
}

/* ---------- views ---------- */
var USER_SVG='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>';
var DOOR_SVG='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4"/><path d="M19 12H9"/></svg>';
function themeIco(){return isDark()?'<span class="tico sun" aria-hidden="true">☀️</span>':'<span class="tico moon" aria-hidden="true">🌙</span>'}
function mast(){
  return '<div class="mast"><button class="brand" data-act="brand">'+esc(S.data.settings.site)+'</button><div class="mast-tools">'+''+'<button class="icon-btn sq" data-act="theme" title="تبديل الوضع الليلي والنهاري" aria-label="تبديل الوضع الليلي والنهاري">'+themeIco()+'</button>'+(S.mode==='supa'?'<button class="icon-btn sq usr'+(S.canEdit?' on':'')+'" data-act="admin" title="'+(S.canEdit?'خروج المدير':'دخول المدير')+'" aria-label="'+(S.canEdit?'خروج المدير':'دخول المدير')+'">'+(S.canEdit?DOOR_SVG:USER_SVG)+'</button>':'')+'</div></div><div class="orn"><i></i></div>';
}
function pickVotd(force){
  var pool=[];S.data.poems.forEach(function(p){p.verses.forEach(function(v,i){if(v[1])pool.push([p.id,i])})});
  if(!pool.length){S.votd=null;return null}
  var ok=S.votd&&S.data.poems.some(function(p){return p.id===S.votd[0]&&p.verses[S.votd[1]]});

  nav.innerHTML=items.map(function(i){var c=i[0]==='diwan'?cnt.d:i[0]==='fav'?cnt.f:0;return '<button data-act="nav" data-nav="'+i[0]+'"'+(cur===i[0]?' aria-current="page"':'')+'>'+(c?'<em class="nb">'+num(c)+'</em>':'')+ico(i[2])+'<span>'+i[1]+'</span></button>'}).join('');
}
function viewMore(){
  var row=function(act,icon,label,val,extra){return '<button class="row" data-act="'+act+'"'+(extra||'')+'><span class="mrow">'+ico(icon)+'<span class="pn">'+label+'</span>'+(val?'<span class="sval">'+val+'</span>':'')+'</span></button>'};
  var dark=isDark();

  '<div class="sgrp">العرض</div>'+

  '<div class="sgrp">خط الأبيات</div><div class="fpick">'+FONTS.map(function(F,i){return '<button class="fopt'+(i===S.fi?' on':'')+'" data-act="setfont" data-i="'+i+'" style="font-family:'+F[1]+'"><span class="fn">'+F[0]+(i===3?' · مثل العنوان':'')+'</span><span class="fs">قِفا نَبكِ مِن ذِكرى حَبيبٍ وَمَنزِلِ</span></button>'}).join('')+'</div>'+
  '<div class="row setrow"><span class="mrow">'+ico('gear')+'<span class="pn">حجم الأبيات</span></span><span class="stp"><button class="icon-btn sq" data-act="fsdown" aria-label="تصغير">أ−</button><b>'+num(Math.round(S.fs*100))+'٪</b><button class="icon-btn sq" data-act="fsup" aria-label="تكبير">أ+</button></span></div>'+
  row('tash','pen','التشكيل',S.tash?'ظاهر':'مخفي')+

  (S.mode==='supa'?'<div class="sgrp">الحساب</div>'+row('admin',S.canEdit?'out':'user',S.canEdit?'خروج المدير':'دخول المدير',S.canEdit?(S.isOwner?'المالك':'مدير'):''):'');
  if(canE()){
    h+='<div class="sgrp">إعدادات المدير</div>'+
    row('add','pen','كتابة قصيدة')+
    '<label class="row file"><span class="mrow">'+ico('up')+'<span class="pn">رفع ملف Word</span></span><input type="file" accept=".docx" data-file="1" id="f-more"></label>'+
    (isO()?row('tools','gear','الموقع والنسخ الاحتياطي والاستعادة'):'');
  }

}
function render(keep){
  var h=!S.ready?viewLoading():S.view==='list'?viewList():S.view==='poem'?viewPoem():S.view==='read'?viewRead():S.view==='edit'?viewEdit():S.view==='import'?viewImport():S.view==='more'?viewMore():S.view==='login'?viewLogin():viewTools();
  var ap=$('#app');ap.innerHTML=h;renderNav();
  if(!keep){window.scrollTo(0,0);ap.classList.remove('vin');void ap.offsetWidth;ap.classList.add('vin')}
  if(S.ready&&S.view!=='poem'&&S.view!=='read')clearHash();
  if(S.view==='read'&&S.ready)readerUpdate();
}
function pHash(id){return '#/p/'+encodeURIComponent(id)}
function pushPoem(id){try{if(location.hash!==pHash(id)){if(S.view==='poem'){history.replaceState(null,'',pHash(id))}else{history.pushState(null,'',pHash(id));S.pushed=true}}}catch(e){}}
function clearHash(){try{if(/^#\/p\//.test(location.hash))history.replaceState(null,'',location.pathname+location.search);S.pushed=false}catch(e){}}
function route(){
  var m=/^#\/p\/(.+)$/.exec(location.hash||'');
  if(m){
    var id=decodeURIComponent(m[1]);
    if(S.data.poems.some(function(x){return x.id===id})){if(S.view==='edit'||S.view==='import')return;S.cur=id;S.view='poem';S.confirm=false;render()}
    else{clearHash()}
  }else if(S.view==='poem'||S.view==='read'){S.view='list';render()}
}
window.addEventListener('popstate',function(){if(S.ready)route()});
function wrapLine(ctx,text,maxW){var words=text.split(' '),lines=[],c='';words.forEach(function(w){var t=c?c+' '+w:w;if(ctx.measureText(t).width>maxW&&c){lines.push(c);c=w}else c=t});if(c)lines.push(c);return lines}
function showImg(url){
  var o=document.createElement('div');o.id='shov';
  o.innerHTML='<div class="shbox"><img alt="بطاقة البيت" src="'+url+'"><div class="shacts"><a class="btn" download="bait.png" href="'+url+'">حفظ الصورة</a><button class="btn" data-act="shclose">إغلاق</button></div><small>على الجوال: اضغط على الصورة مطولًا ثم احفظها.</small></div>';
  document.body.appendChild(o);
}
function shareVerse(p,v){
  var fam=FONTS[S.fi][1].split(',')[0].replace(/'/g,'');
  var load=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load('64px "'+fam+'"'),document.fonts.load('52px "Aref Ruqaa"'),document.fonts.load('36px "IBM Plex Sans Arabic"')]):Promise.resolve();
  load.catch(function(){}).then(function(){
    var W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
    var g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1a2d5e');g.addColorStop(1,'#0c111f');x.fillStyle=g;x.fillRect(0,0,W,H);
    x.strokeStyle='#d9b663';x.lineWidth=3;x.strokeRect(46,46,W-92,H-92);x.lineWidth=1;x.strokeRect(64,64,W-128,H-128);
    var dia=function(cx,cy,r){x.beginPath();x.moveTo(cx,cy-r);x.lineTo(cx+r,cy);x.lineTo(cx,cy+r);x.lineTo(cx-r,cy);x.closePath();x.fill()};
    x.fillStyle='#d9b663';dia(W/2,170,14);x.fillRect(W/2-170,169,130,2);x.fillRect(W/2+40,169,130,2);
    x.direction='rtl';x.textAlign='center';x.textBaseline='middle';
    var t=function(s){return S.tash?s:plain(s)};
    var parts=[t(v[0])];if(v[1])parts.push(t(v[1]));
    var size=64;x.font=size+'px "'+fam+'", serif';
    var lines=[];parts.forEach(function(sx,i){wrapLine(x,sx,W-260).forEach(function(l){lines.push([l,i])})});
    if(lines.length>6){size=52;x.font=size+'px "'+fam+'", serif';lines=[];parts.forEach(function(sx,i){wrapLine(x,sx,W-240).forEach(function(l){lines.push([l,i])})})}
    var lh=Math.round(size*1.85),gap=parts.length>1?70:0,total=lines.length*lh+gap,y=(H-total)/2+lh/2-30,prev=0;
    lines.forEach(function(L){if(L[1]!==prev){x.fillStyle='#d9b663';dia(W/2,y-lh/2+8,9);y+=gap;prev=L[1]}x.fillStyle='#f4efe0';x.font=size+'px "'+fam+'", serif';x.fillText(L[0],W/2,y);y+=lh});
    x.fillStyle='#d9b663';x.font='54px "Aref Ruqaa", serif';x.fillText(p.title,W/2,H-262);
    var po=poetLabel(p);if(po){x.fillStyle='#aab4cc';x.font='38px "Amiri", serif';x.fillText(po,W/2,H-200)}
    x.fillStyle='#7f8aa6';x.font='28px "IBM Plex Sans Arabic", sans-serif';x.fillText(S.data.settings.site||'ديواني',W/2,H-130);
    c.toBlob(function(b){
      if(!b){toast('تعذر إنشاء الصورة');return}
      var file=null;try{file=new File([b],'bait.png',{type:'image/png'})}catch(e){}
      if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:p.title}).catch(function(){})}
      else showImg(URL.createObjectURL(b));
    },'image/png');
  });
}
function updatePrev(){var ta=$('#e-verses');if(!ta)return;var vs=parseVerses(ta.value,$('#e-mode').value);$('#e-prev').innerHTML=vs.length?versesHtml(vs):'<span class="hint">ستظهر الأبيات هنا.</span>';$('#e-cnt').textContent=vs.length?'('+num(vs.length)+' بيتًا)':''}
function renderList(){var lb=$('#listbox');if(!lb)return;lb.innerHTML=listHtml();var v=$('#votd');if(v)v.hidden=!!(S.q||S.bahr||S.tag)}

function blank(){return {id:uid(),title:'',poet:'',section:S.tab==='fav'?'fav':'diwan',star:false,bahr:'',qafiya:'',era:'',source:'',tags:[],occasion:'',gloss:'',verses:[],created:Date.now()}}
function val(id){var e=$('#'+id);return e?e.value.trim():''}
function parseBackup(txt){
  var d;try{d=JSON.parse(txt)}catch(e){return null}
  if(!d||!Array.isArray(d.poems))return null;
  var have={};S.data.poems.forEach(function(p){have[p.id]=1});var add=[];
  d.poems.forEach(function(p){if(p&&p.id&&Array.isArray(p.verses)&&!have[p.id]){have[p.id]=1;add.push(normPoem(p))}});
  return add;
}
function cur(){return S.data.poems.find(function(x){return x.id===S.cur})}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var fw=document.querySelector('.fabwrap');if(fw&&!e.target.closest('.fabwrap'))fw.classList.remove('open');
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,p;
  if(a==='home'){S.confirm=false;if(S.pushed&&/^#\/p\//.test(location.hash)){S.pushed=false;history.back();return}clearHash();S.view='list';render()}
  else if(a==='brand'){S.view='list';S.tab='home';S.poet='';S.q='';S.bahr='';S.tag='';render()}
  else if(a==='nav'){var n=b.dataset.nav;S.confirm=false;S.poet='';S.tag='';
    if(n==='more')S.view='more';else{S.view='list';if(n!==S.tab||n!=='search'){S.q='';S.bahr=''}S.tab=n}
    render();if(n==='search'){var qi=$('#q');if(qi)qi.focus()}}
  else if(a==='tab'){S.view='list';S.tab=b.dataset.tab;S.poet='';S.tag='';render()}
  else if(a==='tag'){S.tag=(b.dataset.tag===S.tag)?'':b.dataset.tag;render(true)}
  else if(a==='tagopen'){S.tag=b.dataset.tag;S.tab='home';S.q='';S.bahr='';S.poet='';S.view='list';render()}
  else if(a==='addtag'){var ti=$('#e-tags'),tl=parseTags(ti.value);if(tl.indexOf(b.dataset.tag)<0)tl.push(b.dataset.tag);ti.value=tl.join('، ')}
  else if(a==='poet'){S.poet=b.dataset.poet;render()}
  else if(a==='clearpoet'){S.poet='';render()}
  else if(a==='open'){pushPoem(b.dataset.id);S.cur=b.dataset.id;S.view='poem';S.confirm=false;render()}
  else if(a==='add'){if(!canE())return;S.edit=blank();S.view='edit';render()}
  else if(a==='edit'){p=cur();S.edit=JSON.parse(JSON.stringify(p));S.view='edit';render()}
  else if(a==='saveedit'){
    var ed=S.edit,title=val('e-title'),verses=parseVerses($('#e-verses').value,$('#e-mode').value);
    if(!title){toast('اكتب عنوان القصيدة');return}
    if(!verses.length){toast('أضف بيتًا واحدًا على الأقل');return}
    ed.title=title;ed.section=$('#e-section').value;ed.poet=val('e-poet');ed.bahr=val('e-bahr');ed.qafiya=val('e-qafiya');ed.era=val('e-era');ed.source=val('e-source');
    ed.tags=parseTags($('#e-tags').value);ed.occasion=val('e-occasion');ed.gloss=val('e-gloss');ed.verses=verses;delete ed.sample;
    var i=S.data.poems.findIndex(function(x){return x.id===ed.id});
    if(i<0)S.data.poems.push(ed);else S.data.poems[i]=ed;
    S.cur=ed.id;S.view='poem';render();
    persistPoem(ed).then(function(){toast('تم الحفظ')},fail);
  }
  else if(a==='star'){p=cur();p.star=!p.star;render(true);persistPoem(p).catch(fail)}
  else if(a==='move'){p=cur();p.section=p.section==='diwan'?'fav':'diwan';render(true);toast('نُقلت إلى '+SECT[p.section]);persistPoem(p).catch(fail)}
  else if(a==='del'){if(!isO())return;S.confirm=true;render(true)}
  else if(a==='delno'){S.confirm=false;render(true)}
  else if(a==='delok'){if(!isO())return;var did=S.cur;S.data.poems=S.data.poems.filter(function(x){return x.id!==did});S.confirm=false;S.view='list';render();removePoem(did).then(function(){toast('حُذفت القصيدة')},fail)}
  else if(a==='theme'){
    var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme=dark?'light':'dark';try{localStorage.setItem(THEME,r.dataset.theme)}catch(x){}
    document.querySelectorAll('.sq[data-act="theme"]').forEach(function(el){el.innerHTML=themeIco()});if(S.view==='more')render(true);toast(dark?'الوضع النهاري ☀️':'الوضع الليلي 🌙')
  }
  else if(a==='admin'){if(S.mode!=='supa')return;if(S.canEdit)logout();else{S.view='login';render()}}
  else if(a==='logout'){logout()}
  else if(a==='tools'){if(!isO())return;S.view='tools';render()}
  else if(a==='fab'){document.querySelector('.fabwrap').classList.toggle('open')}
  else if(a==='shv'){
    if(b.dataset.vot){var r=pickVotd(false);if(r)shareVerse(r.p,r.v)}
    else{p=cur();var vv=p&&p.verses[+b.dataset.i];if(vv)shareVerse(p,vv)}
  }
  else if(a==='shclose'){var ov=$('#shov');if(ov)ov.remove()}
  else if(a==='setfont'){S.fi=+b.dataset.i;applyFont();try{localStorage.setItem('diwan-font',S.fi)}catch(x){}render(true)}
  else if(a==='font'){S.fi=(S.fi+1)%FONTS.length;applyFont();try{localStorage.setItem('diwan-font',S.fi)}catch(x){}toast('الخط: '+FONTS[S.fi][0]);if(S.view==='poem'||S.view==='more')render(true)}
  else if(a==='sharelink'){
    p=cur();var url=location.origin+location.pathname+pHash(p.id);
    if(navigator.share){navigator.share({title:p.title,text:p.title+(poetLabel(p)?' — '+poetLabel(p):''),url:url}).catch(function(){})}
    else{try{navigator.clipboard.writeText(url).then(function(){toast('تم نسخ رابط القصيدة')},function(){toast(url)})}catch(x){toast(url)}}
  }
  else if(a==='votd'){pickVotd(true);render(true)}
  else if(a==='fsup'||a==='fsdown'){S.fs=Math.min(1.6,Math.max(0.8,Math.round((S.fs+(a==='fsup'?0.1:-0.1))*10)/10));try{localStorage.setItem('diwan-fs',S.fs)}catch(x){}var vs=$('.verses')||$('#reader');if(vs)vs.style.setProperty('--fs',S.fs);if(S.view==='more')render(true)}
  else if(a==='tash'){S.tash=!S.tash;try{localStorage.setItem('diwan-tash',S.tash?'1':'0')}catch(x){}render(true)}
  else if(a==='readopen'){S.ri=0;S.dir='';S.view='read';render()}
  else if(a==='rclose'){S.view='poem';render(true)}
  else if(a==='rprev'){readStep(-1)}
  else if(a==='rnext'){readStep(1)}
  else if(a==='copypoem'){
    p=cur();
    var txt=p.title+(poetLabel(p)?'\n'+poetLabel(p):'')+'\n\n'+p.verses.map(function(v){return v[1]?v[0]+'   '+v[1]:v[0]}).join('\n');
    var ok=function(){toast('تم نسخ القصيدة')},no=function(){toast('تعذر النسخ تلقائيًا')};
    try{navigator.clipboard.writeText(txt).then(ok,no)}catch(x){no()}
  }
  else if(a==='impall'){syncImp();var sc=$('#bulk-sec').value,pt=val('bulk-poet');S.imp.forEach(function(q){q.section=sc;q.poet=pt});render(true);toast('طُبّق على كل القصائد')}
  else if(a==='savesettings'){if(!isO())return;S.data.settings.site=val('s-site')||'ديواني';S.data.settings.author=val('s-author');S.view='list';render();persistSettings().then(function(){toast('تم الحفظ')},fail)}
  else if(a==='copy'){
    var ta=$('#b-out');ta.focus();ta.select();
    var done=function(){toast('تم نسخ النص')},bad=function(){toast('حدد النص يدويًا وانسخه')};
    try{navigator.clipboard.writeText(ta.value).then(done,bad)}catch(x){bad()}
  }
  else if(a==='restore'){
    var add=parseBackup($('#b-in').value);
    if(!add){toast('النص غير صالح كنسخة احتياطية');return}
    var bs=null;try{bs=JSON.parse($('#b-in').value).settings}catch(x){}
    S.view='list';render();
    addMany(add).then(function(){
      if(bs&&isO()&&!S.data.settings.author&&bs.author){S.data.settings.author=String(bs.author);return persistSettings()}
    }).then(function(){render(true);toast('أُضيفت '+num(add.length)+' قصيدة')},fail);
  }
  else if(a==='impdel'){syncImp();S.imp.splice(+b.dataset.i,1);render(true)}
  else if(a==='impsave'){
    syncImp();
    var list=S.imp.filter(function(q){return q.title&&q.verses.length}).map(function(q,k){return {id:uid(),title:q.title,poet:q.poet,section:q.section,star:false,bahr:'',qafiya:'',era:'',source:'',tags:[],occasion:'',gloss:'',verses:q.verses,created:Date.now()+k}});
    S.imp=[];S.view='list';render();
    addMany(list).then(function(){render(true);toast('أُضيفت '+num(list.length)+' قصيدة')},fail);
  }
});
function syncImp(){
  [].forEach.call(document.querySelectorAll('.imp-item'),function(el){
    var i=+el.dataset.i,p=S.imp[i];if(!p)return;
    p.title=el.querySelector('.i-title').value.trim();
    p.section=el.querySelector('.i-section').value;
    p.poet=el.querySelector('.i-poet').value.trim();
    p.verses=parseVerses(el.querySelector('.i-verses').value,'auto');p.mode=el.querySelector('.i-mode').value;
  });
}
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;renderList()}
  else if(e.target.id==='e-verses')updatePrev();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='bahr'){S.bahr=t.value;renderList()}
  else if(t.id==='sort'){S.sort=t.value;renderList()}
  else if(t.id==='e-mode'){updatePrev()}
  else if(t.classList&&t.classList.contains('i-mode')){var it=t.closest('.imp-item'),pi=S.imp[+it.dataset.i];if(pi){pi.mode=t.value;it.querySelector('.i-verses').value=verseText(buildVerses(pi.raw||[],t.value))}}
  else if(t.dataset&&t.dataset.file){
    var f=t.files[0];if(!f)return;
    if(!window.mammoth){toast('تعذر تحميل قارئ ملفات Word، تحقق من الاتصال');return}
    var rd=new FileReader();
    rd.onload=function(){
      window.mammoth.convertToHtml({arrayBuffer:rd.result}).then(function(res){
        var sec=S.tab==='fav'?'fav':'diwan';
        S.imp=parseDocx(res.value,f.name).map(function(p){return {title:p.title,verses:p.verses,raw:p.raw,mode:'auto',section:sec,poet:''}});
        S.msg='لم تُستخرج قصائد من الملف. تأكد أنه بصيغة docx وأن فيه نصًا.';S.view='import';render();
      },function(){toast('تعذرت قراءة الملف. تأكد أنه بصيغة docx')});
    };
    rd.readAsArrayBuffer(f);
  }
  else if(t.id==='b-file'){
    var g=t.files[0];if(!g)return;
    var r2=new FileReader();r2.onload=function(){var ta=$('#b-in');if(ta)ta.value=r2.result};r2.readAsText(g);
  }
});
document.addEventListener('submit',function(e){if(e.target.id==='lf'){e.preventDefault();doLogin()}});
/* reading mode: tap lower part of the screen = next verse */
document.addEventListener('click',function(e){
  if(S.view!=='read'||swiped)return;
  if(e.target.closest('button,a,input,select'))return;
  if(!e.target.closest('#reader'))return;
  if(e.clientY>window.innerHeight*0.5){
    var p=cur();if(p&&S.ri>=p.verses.length-1)toast('نهاية القصيدة');else readStep(1)
  }else if(e.clientY>window.innerHeight*0.2&&e.clientY<=window.innerHeight*0.5){readStep(-1)}
});
/* reading mode: swipe and keys */
var tx=null,ty=0,swiped=false;
document.addEventListener('touchstart',function(e){if(S.view==='read'&&e.touches.length===1){tx=e.touches[0].clientX;ty=e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',function(e){
  if(S.view!=='read'||tx===null)return;
  var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){swiped=true;setTimeout(function(){swiped=false},400);readStep(dx<0?1:-1)}
},{passive:true});
document.addEventListener('keydown',function(e){
  if(S.view!=='read')return;
  if(e.key==='ArrowLeft')readStep(1);
  else if(e.key==='ArrowRight')readStep(-1);
  else if(e.key==='Escape'){S.view='poem';render(true)}
});

render();
boot();
})();
