<style>
/* Layout: a single reading column, quiet masthead, ruled poem list; verses set as two hemistichs across the page centre. */
:root{
  --bg:#f0ede4; --surface:#f8f6ef; --ink:#262d3f; --muted:#586072; --line:#d8d3c6; --tint:#e5e8ef;
  --accent:#2b4378; --on-accent:#ffffff; --gold:#84611a; --danger:#a13434;
  --f-display:'Aref Ruqaa','Amiri',serif; --f-verse:'Amiri','Traditional Arabic',serif; --f-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b2230; --surface:#232b3c; --ink:#d6dae4; --muted:#a6aec1; --line:#38425c; --tint:#2b3550;
  --accent:#9bb3ec; --on-accent:#141a2a; --gold:#d4b569; --danger:#e8a0a0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b2230; --surface:#232b3c; --ink:#d6dae4; --muted:#a6aec1; --line:#38425c; --tint:#2b3550;
  --accent:#9bb3ec; --on-accent:#141a2a; --gold:#d4b569; --danger:#e8a0a0; color-scheme:dark}
html{direction:rtl}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:20px 110px}
#app{max-width:860px;margin-inline:auto;direction:rtl;text-align:start}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:clamp(2.2rem,7vw,3.4rem);line-height:1.3;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:start}
.mast-tools{display:flex;gap:8px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink);font-size:.9rem}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
.orn{display:flex;align-items:center;gap:12px;margin-block:4px 18px;color:var(--gold)}
.orn::before,.orn::after{content:"";height:1px;flex:1;background:linear-gradient(to var(--d,left),var(--gold),transparent);opacity:.7}
.orn::after{--d:right}
.orn i{width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.sub{color:var(--muted);font-size:.95rem;margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-block:18px 14px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--gold)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.bar .grow{flex:1 1 220px;min-width:0}
input[type=text],input[type=search],input[type=email],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0}
textarea{font-family:var(--f-verse);font-size:1.2rem;line-height:2;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.sm{padding:5px 12px;font-size:.9rem}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px;margin-block:8px;font-size:.92rem}
.chip button{border:0;background:var(--line);border-radius:50%;width:22px;height:22px;cursor:pointer;color:var(--ink)}
.list{margin:0;padding:0;list-style:none}
.row{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 2px;cursor:pointer}
.row:hover .rt{color:var(--accent)}
.rt{font-family:var(--f-verse);font-weight:700;font-size:1.45rem;line-height:1.5;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.star{color:var(--gold);font-size:1rem}
.badge{font-family:var(--f-ui);font-size:.72rem;font-weight:500;border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:0 6px}
.rm{color:var(--muted);font-size:.88rem}
.rx{font-family:var(--f-verse);color:var(--muted);font-size:1.12rem;margin-top:2px}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.empty .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.poets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 24px}
.poets .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pn{font-family:var(--f-verse);font-weight:700;font-size:1.3rem}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 0;margin-bottom:6px}
.ptitle{font-family:var(--f-display);font-size:clamp(2rem,6vw,3rem);line-height:1.45;color:var(--accent);margin:6px 0 2px;text-wrap:balance}
.pmeta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:.92rem;margin:0 0 4px}
.pmeta b{color:var(--ink);font-weight:600}
.verses{margin-block:8px 20px;padding-block:6px}
.v{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;column-gap:clamp(2rem,9vw,5rem);padding-block:.2rem;font-family:var(--f-verse);font-size:calc(clamp(1.3rem,3.4vw,1.75rem) * var(--fz,1));line-height:var(--flh,2.1)}
.v .s,.v .j{text-align:center}
.v.one{grid-template-columns:1fr}
.v.one .s{text-align:center}
.acts-row{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.form{display:grid;gap:14px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f,div.f{display:grid;gap:4px;font-size:.9rem;color:var(--muted);min-width:0}
h2.h{font-family:var(--f-display);font-size:1.9rem;color:var(--accent);margin:8px 0 12px;font-weight:400}
.hint{color:var(--muted);font-size:.88rem;margin:0}
.imp-item{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;display:grid;gap:10px;margin-bottom:14px}
.imp-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.box{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px;margin-bottom:16px;display:grid;gap:10px}
.box h3{margin:0;font-size:1.05rem}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 18px;font-size:.92rem;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:40}
#toast.on{opacity:1;transform:none}
.warn{border:1px solid var(--gold);color:var(--muted);border-radius:8px;padding:8px 12px;font-size:.9rem;margin-top:10px}
.usr.on{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.sq{width:42px;height:42px;padding:0;display:inline-grid;place-items:center;font-size:1.15rem;line-height:1}
.votd{background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;margin-block:14px 6px;text-align:center}
.votd small{display:block;color:var(--gold);font-weight:600;letter-spacing:.04em;margin-bottom:2px}
.votd .v{font-size:clamp(1.15rem,3vw,1.5rem)}
.votd-foot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.9rem}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.fabwrap{position:fixed;inset-inline-end:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:5}
.fab{border:0;border-radius:50%;width:48px;height:48px;padding:0;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-weight:400;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:1.9rem;line-height:1}
.fab-menu{display:none;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.2)}
.fabwrap.open .fab-menu{display:flex}
.fab-menu .btn{justify-content:flex-start;border-color:transparent;color:var(--ink);padding:10px 14px;width:100%}
.fab-menu .btn:hover{background:var(--tint);filter:none}
.count{color:var(--muted);font-size:.88rem;margin:6px 2px}
.tools-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.nav2 .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis}
.verses .v{font-size:calc(clamp(1.3rem,3.4vw,1.75rem) * var(--fs,1) * var(--fz,1))}
.bulk{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:16px;padding:12px;border:1px dashed var(--gold);border-radius:10px}
.prev{border:1px dashed var(--line);border-radius:10px;padding:6px 10px;max-height:340px;overflow:auto;background:var(--surface);color:var(--ink);margin-top:4px}
.prev .v{font-size:1.15rem;line-height:1.9;column-gap:2rem}
.row.file{position:relative;overflow:hidden}
.row.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.mrow{display:flex;align-items:center;gap:14px}
.mrow svg{width:22px;height:22px;fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:8px 10px}
.tg{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:.9rem}
.tg:hover{color:var(--ink);border-color:var(--muted)}
.tg[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ptags{display:flex;gap:8px;flex-wrap:wrap;margin-block:6px 2px}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg .tg{padding:2px 10px;font-size:.85rem}
.notes{border-top:1px solid var(--line);padding-block:12px 4px;margin-bottom:6px}
.notes h3{margin:0 0 4px;font-size:.95rem;color:var(--gold);font-weight:600}
.notes p{margin:0;color:var(--ink)}
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:4px 18px;margin:0}
.gloss dt{font-family:var(--f-verse);font-weight:700;font-size:1.15rem}
.gloss dd{margin:0;color:var(--muted)}
.loading{padding:60px 8px;text-align:center;color:var(--muted)}
.reader{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));direction:rtl}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rtitle{font-family:var(--f-display);color:var(--accent);font-size:1.3rem;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtools{display:flex;gap:6px}
.rbody{display:grid;place-items:center;overflow-y:auto;padding-block:12px}
.rv{text-align:center;font-family:var(--f-verse);font-size:calc(clamp(1.9rem,7vw,3.2rem) * var(--fs,1) * var(--fz,1));line-height:var(--flh,2.1);max-width:900px;animation:rin .3s ease}
.rorn{display:flex;justify-content:center;margin-block:.15em}
.rorn i{width:9px;height:9px;background:var(--gold);transform:rotate(45deg)}
.rbot{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:900px;width:100%;margin-inline:auto;color:var(--muted)}
@keyframes rin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#bnav{display:none}
@media (max-width:620px){
  .bulk{grid-template-columns:1fr}
  .v{grid-template-columns:minmax(0,1fr);column-gap:0}
  .v .s{text-align:start}.v .j{text-align:end;padding-inline-start:14%}
  .v.one .s{text-align:center}
  .form .two{grid-template-columns:1fr}
  .rv .v{display:block}
  #bnav{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);border-radius:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 18px rgba(10,20,50,.12);z-index:50;transform:translateZ(0)}
  #toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #bnav button{position:relative;background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 0 5px;border-radius:14px;color:var(--muted);font-size:.74rem;cursor:pointer;min-width:0;transition:background .2s,color .2s}
  #bnav button[aria-current="page"]{color:var(--accent);font-weight:600;background:var(--tint)}
  #bnav button[aria-current="page"]::before{display:none}
  #bnav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #bnav button[data-nav="flash"]{margin-top:-28px;background:none;color:var(--accent);font-weight:600}
  #bnav button[data-nav="flash"]::before{display:none}
  #bnav button[data-nav="flash"] svg{width:54px;height:54px;padding:14px;border-radius:50%;background:var(--accent);stroke:var(--on-accent);border:3px solid var(--bg);box-shadow:0 6px 16px rgba(0,0,0,.28)}
  #bnav button[data-nav="flash"][aria-current="page"] svg{box-shadow:0 0 0 2px var(--gold),0 6px 16px rgba(0,0,0,.28)}
  #bnav .nb{position:absolute;top:0;inset-inline-start:calc(50% + 5px);font-style:normal;font-size:.62rem;line-height:1;font-weight:600;background:var(--gold);color:var(--on-accent);border-radius:999px;padding:2px 5px;min-width:16px;text-align:center}
  .tabs{display:none}
  .fabwrap{bottom:calc(98px + env(safe-area-inset-bottom,0px))}
  body{padding-block-end:170px}
  #toast{bottom:calc(106px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.rv{animation:none}}

/* ---- v2: share, theme icon, motion ---- */
.vw{position:relative;padding-inline:34px}
.shv{position:absolute;inset-inline-end:0;top:50%;transform:translateY(-50%);width:32px;height:32px;display:grid;place-items:center;border-radius:50%;border:0;background:none;color:var(--muted);opacity:0;pointer-events:none;cursor:pointer;transition:opacity .2s,background .2s,color .2s}
.vw:hover .shv,.vw.sel .shv,.shv:focus-visible{opacity:1;pointer-events:auto}.shv:hover{background:var(--tint);color:var(--accent)}
@media (hover:none){.vw.sel .shv{background:var(--tint);color:var(--accent)}}
.tico{display:inline-grid;place-items:center;line-height:1;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.sq:hover .tico{transform:rotate(25deg) scale(1.12)}
.tico.sun{animation:tspin .6s ease}.tico.moon{animation:tpop .5s ease}
@keyframes tspin{from{transform:rotate(-120deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes tpop{from{transform:scale(.3) rotate(40deg);opacity:0}to{transform:none;opacity:1}}
.usr svg{transition:transform .3s}.usr.on svg{transform:none}
.votd{position:relative;background:linear-gradient(160deg,var(--tint),var(--surface));border-color:var(--gold);padding:20px 16px 14px;box-shadow:0 8px 24px rgba(10,20,50,.08)}
.votd small{font-family:var(--f-display);font-size:1.15rem;margin-bottom:6px}
.rprog{height:3px;background:var(--line);border-radius:3px;overflow:hidden;max-width:900px;width:100%;margin-inline:auto}
.rprog i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
#shov{position:fixed;inset:0;z-index:90;background:rgba(5,8,18,.82);display:grid;place-items:center;padding:16px;animation:fin .2s ease}
.shbox{background:var(--surface);border-radius:16px;padding:14px;max-width:min(94vw,460px);max-height:94vh;overflow:auto;text-align:center;display:grid;gap:10px}
.shbox img{width:100%;height:auto;max-height:68vh;object-fit:contain;border-radius:10px}
.shacts{display:flex;gap:8px;justify-content:center}.shbox small{color:var(--muted)}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#app.vin{animation:vin .35s ease}
#app.vin #listbox li,#app.vin .vw{animation:rin .45s ease both;animation-delay:calc(var(--d,0)*45ms)}
#app.vin #listbox li:nth-child(1){--d:1}
#app.vin #listbox li:nth-child(2){--d:2}
#app.vin #listbox li:nth-child(3){--d:3}
#app.vin #listbox li:nth-child(4){--d:4}
#app.vin #listbox li:nth-child(5){--d:5}
#app.vin #listbox li:nth-child(6){--d:6}
#app.vin #listbox li:nth-child(7){--d:7}
#app.vin #listbox li:nth-child(8){--d:8}
#app.vin #listbox li:nth-child(9){--d:9}
#app.vin #listbox li:nth-child(10){--d:10}
#app.vin #listbox li:nth-child(11){--d:11}
#app.vin #listbox li:nth-child(12){--d:12}
.row{border-radius:8px;transition:background .2s,padding .2s}
.row:hover{background:var(--tint);padding-inline:12px}
.btn,.icon-btn,.fab{transition:transform .15s,background .2s,box-shadow .2s}
.btn:active,.icon-btn:active,.fab:active{transform:scale(.96)}
.votd{animation:rin .5s ease}
@media (prefers-reduced-motion:reduce){#app.vin,#app.vin *,.tico,.votd,#shov{animation:none!important}.row,.btn,.icon-btn{transition:none}}
.rmid{display:grid;justify-items:center;line-height:1.4}.rhint{font-size:.7rem;opacity:.7;text-align:center}

.flc .flspark::before,.flc .flspark::after{content:"";width:46px;height:1px;background:linear-gradient(to var(--d,left),var(--gold),transparent);opacity:.75}
.flc .flspark::after{--d:right}
.flc .flspark i{display:grid;place-items:center;width:42px;height:42px;background:linear-gradient(135deg,#223566,#14203f);transform:rotate(45deg);border:1.5px solid var(--gold);outline:1px solid var(--gold);outline-offset:4px;border-radius:2px;box-shadow:0 3px 10px rgba(20,32,63,.35);margin-block:8px}
.flc .flspark svg{height:25px;width:auto;fill:#e2c673;transform:rotate(-45deg)}
.flc .v{font-size:clamp(1.25rem,4.4vw,1.7rem);padding-block:4px}
.flc::after{content:"";position:absolute;inset:8px;border:1px solid var(--gold);border-radius:18px;opacity:.28;pointer-events:none}
.flwho{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;color:var(--muted);font-size:.92rem}

.flhint{margin:0;text-align:center;color:var(--muted);font-size:.85rem;transition:opacity .6s}.flhint.off{opacity:0}
.flbar{display:grid;grid-template-columns:54px 1fr 54px;gap:10px}

.flbar .btn.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media print{#flash{display:none!important}}

/* رأس الرئيسية والتفاصيل */
.hero{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;margin:6px 0 10px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(160deg,var(--tint),var(--surface));text-align:start;cursor:pointer;color:var(--ink)}

.flheart{position:absolute;top:10px;inset-inline-start:10px;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;z-index:2;transition:transform .2s,color .2s,background .2s}
.flheart svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;transition:fill .2s,transform .3s cubic-bezier(.34,1.8,.64,1)}
.flheart:hover{background:var(--tint)}
.flheart.on{color:#c4455c}.flheart.on svg{fill:#c4455c;transform:scale(1.12)}
.flheart:active svg{transform:scale(.85)}

<div id="app"></div>
<iframe name="lf-frame" title="" hidden style="display:none"></iframe>
<button id="sidehandle" data-act="sidetoggle" aria-label="إظهار القائمة الجانبية" title="القائمة"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
<nav id="bnav" aria-label="التنقل"></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
var KEY='diwan-v1', THEME='diwan-theme';
var BAHRS=['الطويل','المديد','البسيط','الوافر','الكامل','الهزج','الرجز','الرمل','السريع','المنسرح','الخفيف','المضارع','المقتضب','المجتث','المتقارب','المتدارك','شعر التفعيلة','نبطي'];
var DEFAULT_TAGS=['غزل','رثاء','حكمة','وطنيات','مدح','فخر','وصف','زهد ودين','اجتماعيات'];
var SECT={diwan:'ديواني',fav:'المفضلة'};
document.documentElement.dir='rtl';document.documentElement.lang='ar';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var num=function(n){return Number(n).toLocaleString('ar-EG')};
var uid=function(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var norm=function(s){return String(s||'').replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase()};

var SAMPLE={id:'sample1',title:'على قدر أهل العزم',poet:'المتنبي',section:'fav',star:true,sample:true,bahr:'الطويل',qafiya:'الميم',era:'العصر العباسي',source:'',tags:['حكمة','فخر'],occasion:'',gloss:'',
 verses:[['عَلى قَدرِ أَهلِ العَزمِ تَأتي العَزائِمُ','وَتَأتي عَلى قَدرِ الكِرامِ المَكارِمُ'],['وَتَعظُمُ في عَينِ الصَغيرِ صِغارُها','وَتَصغُرُ في عَينِ العَظيمِ العَظائِمُ']],created:0};
function freshData(){return {poems:[],drafts:[],bayt:[],settings:{site:'ديواني',author:''}}}

var storageOk=true;
function canE(){return S.canEdit}
function isO(){return S.isOwner}
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.poems)){d.settings=d.settings||{};return d}}}catch(e){storageOk=false}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S.data));storageOk=true}catch(e){storageOk=false}}
function peekLocal(){var d=load();if(!d)return null;var l=d.poems.filter(function(p){return !p.sample&&p.id!=='sample1'});return l.length?{poems:l,settings:d.settings}:null}

var S={data:freshData(),mode:'',ready:false,canEdit:false,isOwner:false,err:'',tab:'home',q:'',bahr:'',tag:'',poet:'',sort:'new',view:'list',cur:null,edit:null,imp:[],confirm:false,msg:'',fs:1,votd:null,tash:true,ri:0};
var BUILD='2026.10.04-aq';
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
S.focus=null;S.settingsExt=false;S.photoExt=false;S.social=null;S.likes={};S.mylikes={};S.cmts=[];S.pending=[];S.newIds=[];S.onlyNew=false;S.ms=!!LS.get('diwan-ms',false);
if(S.ms)document.documentElement.dataset.ms='1';
var FONTS=[['أميري',"'Amiri','Traditional Arabic',serif",1,2.1],['نسخ',"'Noto Naskh Arabic','Amiri',serif",.9,2.3],['شهرزاد',"'Scheherazade New','Amiri',serif",.94,2.2],['مركزي',"'Markazi Text','Amiri',serif",1.12,1.95]];S.fi=0;S.favseg='poems';
try{var fi0=parseInt(localStorage.getItem('diwan-font'));if(fi0>=0&&fi0<FONTS.length)S.fi=fi0}catch(e){}
function applyFont(){var r=document.documentElement.style,F=FONTS[S.fi];r.setProperty('--f-verse',F[1]);r.setProperty('--fz',F[2]);r.setProperty('--flh',F[3])}applyFont();
function isDark(){var r=document.documentElement;return r.dataset.theme?r.dataset.theme==='dark':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
try{var fsv=parseFloat(localStorage.getItem('diwan-fs'));if(fsv>=0.8&&fsv<=1.6)S.fs=fsv;if(localStorage.getItem('diwan-tash')==='0')S.tash=false}catch(e){}
try{var th=localStorage.getItem(THEME);if(th)document.documentElement.dataset.theme=th}catch(e){}

function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},2600)}
function fail(){toast('تعذر الحفظ، حاول مرة أخرى')}

/* ---------- persistence (account db, or this browser as fallback) ---------- */
function cleanPoem(p){return {title:p.title||'',poet:p.poet||'',section:p.section==='fav'?'fav':'diwan',star:!!p.star,bahr:p.bahr||'',qafiya:p.qafiya||'',era:p.era||'',source:p.source||'',tags:(p.tags||[]).slice(0,20),occasion:p.occasion||'',gloss:p.gloss||'',verses:(p.verses||[]).map(function(v){return [v[0]||'',v[1]||'']}),created:p.created||Date.now(),sample:!!p.sample,draft:!!p.draft,kind:p.kind==='bayt'?'bayt':'poem'}}
function normPoem(x,id){var p=cleanPoem(x);p.id=id||x.id;if(!p.sample)delete p.sample;return p}
var sb=null, fetchT=null;
function rowOf(p){var r=cleanPoem(p);r.id=p.id;if(!S.polyExt){delete r.draft;delete r.kind}return r}
function ensureArrs(){S.data.drafts=S.data.drafts||[];S.data.bayt=S.data.bayt||[]}
function splitRows(list){var P=[],D=[],B=[];list.forEach(function(p){if(p.draft)D.push(p);else if(p.kind==='bayt')B.push(p);else P.push(p)});S.data.poems=P;S.data.drafts=D;S.data.bayt=B}
function bucketPut(p){ensureArrs();['poems','drafts','bayt'].forEach(function(k){S.data[k]=S.data[k].filter(function(x){return x.id!==p.id})});S.data[p.draft?'drafts':(p.kind==='bayt'?'bayt':'poems')].push(p)}
function findP(id){ensureArrs();return S.data.poems.find(function(x){return x.id===id})||S.data.drafts.find(function(x){return x.id===id})||S.data.bayt.find(function(x){return x.id===id})}
function chk(r){if(r&&r.error)throw r.error;return r}
function persistPoem(p){if(S.mode==='supa')return sb.from('poems').upsert(rowOf(p)).then(chk);save();return Promise.resolve()}
function removePoem(id){if(S.mode==='supa')return sb.from('poems').delete().eq('id',id).then(chk);save();return Promise.resolve()}
function photoPv(st){return st&&st.photo?'<img src="'+esc(st.photo)+'" alt="">':esc(((st&&(st.author||st.site))||'د').trim().charAt(0))}
function readPhoto(file,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=480;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,480,480);cb(c.toDataURL('image/jpeg',0.85))};im.onerror=function(){toast('تعذر قراءة الصورة')};im.src=fr.result};fr.onerror=function(){toast('تعذر قراءة الصورة')};fr.readAsDataURL(file)}
function persistSettings(){if(S.mode==='supa'){var st=S.data.settings,row={id:1,site:st.site||'ديواني',author:st.author||''};if(S.settingsExt){row.bio=st.bio||'';row.links=st.links||[]}if(S.photoExt)row.photo=st.photo||'';return sb.from('settings').upsert(row).then(chk)}save();return Promise.resolve()}
function addMany(list){
  if(S.mode!=='supa'){list.forEach(function(p){bucketPut(p)});save();return Promise.resolve()}
  return sb.from('poems').upsert(list.map(rowOf)).then(chk).then(fetchPoems);
}
function fetchPoems(){return sb.from('poems').select('*').then(chk).then(function(r){var rows=r.data||[];if(rows.length)S.polyExt=('draft' in rows[0])&&('kind' in rows[0]);var all=rows.map(function(x){return normPoem(x,x.id)});splitRows(all);try{localStorage.setItem('diwan-cache',JSON.stringify({poems:all,settings:S.data.settings}))}catch(e){}})}
function fetchSettings(){return sb.from('settings').select('*').eq('id',1).maybeSingle().then(chk).then(function(r){var x=r.data;if(x){S.settingsExt=('bio' in x);S.photoExt=('photo' in x);S.data.settings={site:x.site||'ديواني',author:x.author||'',photo:x.photo||'',bio:x.bio||'',links:Array.isArray(x.links)?x.links:[]}}})}
function loadRole(session){

/* ---------- verses <-> text ---------- */
var SEP=/\s*(?:\.{2,}|…|\t| {2,}|\s{3,}|\*{1,3}|[-–—]{2,})\s*/;
function plain(s){return String(s).replace(/[ً-ٰٟـ]/g,'')}
function hasTash(p){return p.verses.some(function(v){return /[ً-ٰٟ]/.test(v[0]+v[1])})}
function splitMid(l){
  var w=l.trim().split(/\s+/);if(w.length<2)return [l.trim(),''];
  var tot=plain(l).length,acc=0,best=1,bd=1e9;
  for(var i=1;i<w.length;i++){acc+=plain(w[i-1]).length+1;var d=Math.abs(acc-(tot-acc));if(d<bd){bd=d;best=i}}
  return [w.slice(0,best).join(' '),w.slice(best).join(' ')];
}
function buildVerses(lines,mode){
  lines=lines.map(function(l){return l.trim()}).filter(Boolean);
  if(!mode||mode==='auto'){
    if(lines.some(function(l){return SEP.test(l)}))mode='sep';
    else{var avg=lines.reduce(function(a,l){return a+plain(l).length},0)/(lines.length||1);mode=avg<=38?'pair':'split'}
  }
  var out=[],i;
  if(mode==='pair'){for(i=0;i<lines.length;i+=2)out.push([lines[i],lines[i+1]||''])}
  else if(mode==='split'){out=lines.map(splitMid)}
  else{lines.forEach(function(l){var p=l.split(SEP).filter(Boolean);out.push(p.length>1?[p[0],p.slice(1).join(' ')]:[l,''])})}
  return out;
}
function parseVerses(text,mode){return buildVerses(String(text).split('\n'),mode)}
var GL=[];
function gkey(w){return plain(w).replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^ء-ي0-9a-zA-Z]/g,'')}
function gvars(k){var out={};out[k]=1;var qs=[k];while(qs.length){var x=qs.pop();[/^[وفبلك]/,/^ال/].forEach(function(re){if(re.test(x)){var y=x.replace(re,'');if(y.length>=2&&!out[y]){out[y]=1;qs.push(y)}}})}return Object.keys(out)}
function glossify(text,strip){
  var t=function(x){return esc(strip?plain(x):x)};
  if(!GL.length)return t(text);
  var parts=String(text).split(/(\s+)/),idx=[];
  parts.forEach(function(x,i){if(x&&!/^\s+$/.test(x))idx.push(i)});
  var keys=idx.map(function(i){return gkey(parts[i])});
  var terms=GL.map(function(g){return g[0].split(/\s+/).map(gkey).filter(Boolean)});
  var out='',k=0;
  while(k<idx.length){
    var hit=-1,len=1;
    for(var gi=0;gi<terms.length&&hit<0;gi++){
      var tm=terms[gi];if(!tm.length)continue;
      if(tm.length===1){if(keys[k]&&gvars(keys[k]).indexOf(tm[0])>-1){hit=gi;len=1}}
      else if(k+tm.length<=idx.length){var ok=true;for(var m=0;m<tm.length;m++){if(m===0?gvars(keys[k]).indexOf(tm[0])<0:keys[k+m]!==tm[m]){ok=false;break}}if(ok){hit=gi;len=tm.length}}
    }
    var from=idx[k],to=idx[k+len-1];
    if(hit>=0){out+='<span class="gw" data-g="'+hit+'" role="button" tabindex="0">'+t(parts.slice(from,to+1).join(''))+'</span>';}
    else out+=t(parts.slice(from,to+1).join(''));
    var nxt=k+len<idx.length?idx[k+len]:parts.length;
    out+=t(parts.slice(to+1,nxt).join(''));
    k+=len;
  }
  return t(parts.slice(0,idx.length?idx[0]:0).join(''))+out;
}

/* ---------- Word -> poems ---------- */
function parseDocx(html,fname){
  var doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');
  var els=[].slice.call(doc.body.firstChild.children);
  var hasH=els.some(function(e){return /^H[1-6]$/.test(e.tagName)});
  var isBold=function(e){return e.tagName==='P'&&e.children.length===1&&e.firstElementChild.tagName==='STRONG'&&e.textContent.trim()===e.firstElementChild.textContent.trim()&&!SEP.test(e.textContent.trim())};
  var ps=els.filter(function(e){return e.tagName==='P'&&e.textContent.trim()});
  var boldCount=ps.filter(isBold).length;
  var useBold=!hasH&&boldCount>0&&boldCount<ps.length*0.5;
  var poems=[],cur=null;
  var start=function(title){cur={title:title,lines:[]};poems.push(cur)};
  els.forEach(function(el){
    var c=el.cloneNode(true);c.querySelectorAll('br').forEach(function(b){b.replaceWith('\n')});
    var text=c.textContent;
    if(/^H[1-6]$/.test(el.tagName)){if(text.trim())start(text.trim());return}
    if(useBold&&isBold(el)){start(text.trim());return}
    text.split('\n').forEach(function(line){
      var t=line.trim();if(!t)return;
      if(!cur)start(fname.replace(/\.[^.]+$/,''));
      cur.lines.push(t);
    });
  });
  return poems.filter(function(p){return p.lines.length}).map(function(p){return {title:p.title,raw:p.lines,verses:buildVerses(p.lines,'auto')}});
}

function reauth(pw){return sb.auth.signInWithPassword({email:S.email,password:pw}).then(function(r){if(r.error)throw new Error('badpw')})}
function doChangePw(){
  var cur=($('#a-cur')||{}).value||'',n1=($('#a-new')||{}).value||'',n2=($('#a-new2')||{}).value||'';
  if(!cur||!n1){toast('أكمل الحقول');return}
  if(n1.length<8){toast('كلمة المرور الجديدة قصيرة');return}
  if(n1!==n2){toast('التأكيد لا يطابق كلمة المرور الجديدة');return}
  var b=$('#a-pbtn');if(b)b.disabled=true;
  reauth(cur).then(function(){return sb.auth.updateUser({password:n1})}).then(function(r){
    if(r.error)throw r.error;
    toast('تم تغيير كلمة المرور');S.view='more';render();
  }).catch(function(e){if(b)b.disabled=false;toast(e&&e.message==='badpw'?'كلمة المرور الحالية غير صحيحة':'تعذر التغيير، حاول مرة أخرى')});
}
function doChangeEmail(){
  var cur=($('#b-cur')||{}).value||'',em=(($('#b-new')||{}).value||'').trim();
  if(!cur||!em){toast('أكمل الحقول');return}
  if(em===S.email){toast('هذا هو بريدك الحالي');return}
  var b=$('#a-ebtn');if(b)b.disabled=true;
  reauth(cur).then(function(){return sb.auth.updateUser({email:em})}).then(function(r){
    if(r.error)throw r.error;
    try{LS.set('diwan-email',em)}catch(e){}
    toast('أُرسل رابط التأكيد إلى البريد الجديد');S.view='more';render();
  }).catch(function(e){if(b)b.disabled=false;toast(e&&e.message==='badpw'?'كلمة المرور الحالية غير صحيحة':'تعذر التغيير، تأكد من البريد وحاول مرة أخرى')});
}
function viewLogin(){

function viewLoading(){return mast()+'<div class="loading">جارٍ تحميل القصائد…</div>'}
function barHtml(){
  var bahrs=[];S.data.poems.forEach(function(p){if(p.bahr&&bahrs.indexOf(p.bahr)<0)bahrs.push(p.bahr)});
  return '<div class="bar2"><label class="srch">'+ico('search')+'<input type="search" id="q" placeholder="ابحث في العنوان أو الشاعر أو الأبيات" value="'+esc(S.q)+'"></label>'+
  '<div class="fsel"><select id="bahr" aria-label="البحر"><option value="">كل البحور</option>'+bahrs.map(function(b){return '<option'+(S.bahr===b?' selected':'')+'>'+esc(b)+'</option>'}).join('')+'</select>'+
  '<select id="sort" aria-label="الترتيب"><option value="new"'+(S.sort==='new'?' selected':'')+'>الأحدث</option><option value="title"'+(S.sort==='title'?' selected':'')+'>حسب العنوان</option></select></div></div>';
}
function featuredHtml(){
  var l=S.data.poems.filter(function(p){return p.star&&!p.sample}).slice(0,5);
  if(!l.length)return '';
  return '<h3 class="sct">مختارات الشاعر</h3><ul class="list">'+l.map(rowHtml).join('')+'</ul>';
}
function collectionsHtml(){
  var m={};S.data.poems.forEach(function(p){(p.tags||[]).forEach(function(t){m[t]=(m[t]||0)+1})});
  var names=Object.keys(m).sort(function(a,b){return m[b]-m[a]||a.localeCompare(b,'ar')}).slice(0,8);
  if(!names.length)return '';
  return '<h3 class="sct">المجموعات</h3><div class="colls">'+names.map(function(t){return '<button class="coll" data-act="collopen" data-tag="'+esc(t)+'"><b>'+esc(t)+'</b><span>'+(m[t]===1?'قصيدة واحدة':m[t]===2?'قصيدتان':num(m[t])+(m[t]<=10?' قصائد':' قصيدة'))+'</span></button>'}).join('')+'</div>';
}
function draftsHtml(){
  ensureArrs();if(!canE()||!S.data.drafts.length)return '';
  return '<p class="dnote2">المسودات لا يراها غيرك. افتح مسودة ثم اضغط «نشر» لتظهر للزوار.</p><ul class="list">'+S.data.drafts.slice().sort(function(a,b){return (b.created||0)-(a.created||0)}).map(rowHtml).join('')+'</ul>';

function draftSegHtml(){

function heroHtml(){
  var st=S.data.settings,sx=statsOf(S.data.poems.filter(function(p){return !p.draft}));
  var tag=(st.bio||'').split(/[\n.،؛]/)[0].trim();if(tag.length>70)tag=tag.slice(0,68).trim()+'…';
  var cnt=sx.poems?(num(sx.poems)+' قصيدة'+(sx.verses?' · '+num(sx.verses)+' بيتًا':'')):'';
  return '<button class="hero" data-act="nav" data-nav="about"><span class="avatar sm'+(st.photo?' ph':'')+'" aria-hidden="true">'+photoPv(st)+'</span><span class="hmeta"><b>'+esc(st.author||st.site)+'</b><span>'+esc(tag||'قصائد وأبيات')+'</span>'+(cnt?'<small>'+cnt+'</small>':'')+'</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>';
}
function homeHtml(){
  if(!S.data.poems.length)return listHtml();
  var all=S.data.poems.slice().sort(function(a,b){return (b.created||0)-(a.created||0)});
  var latest=S.onlyNew?visible():all.slice(0,6);
  return '<button class="srch fake" data-act="nav" data-nav="search">'+ico('search')+'<span>ابحث في القصائد والأبيات</span></button>'+
  newBarHtml()+resumeHtml()+votdHtml()+(S.onlyNew?'':featuredHtml()+collectionsHtml())+
  '<h3 class="sct">'+(S.onlyNew?'القصائد الجديدة':'أحدث القصائد')+'</h3><ul class="list">'+latest.map(rowHtml).join('')+'</ul>'+
  '<div class="hacts"><button class="btn" data-act="nav" data-nav="diwan">كل القصائد</button><button class="btn" data-act="random">قصيدة عشوائية</button></div>';
}
function baytHtml(){
  ensureArrs();
  var l=S.data.bayt.slice().sort(function(a,b){return (b.created||0)-(a.created||0)});
  var add=canE()?'<div class="hacts"><button class="btn primary" data-act="baytadd">+ إضافة بيت أعجبني</button></div>':'';
  if(!l.length)return add+'<div class="empty">'+(canE()?'لم تضف أبياتًا بعد.':'لا توجد أبيات مفضلة بعد.')+'</div>';
  return add+'<div class="fvlist">'+l.map(function(p){
    var vs=p.verses.map(function(v){var t=function(x){return esc(S.tash?x:plain(x))};return '<div class="v"><span class="s">'+t(v[0])+'</span>'+(v[1]?'<span class="j">'+t(v[1])+'</span>':'')+'</div>'}).join('');
    var who=[p.poet,p.source].filter(Boolean).map(esc).join(' · ');

  }).join('')+'</div>';

function mineHtml(){

    var v=x.t||['',''],t=function(s){return esc(S.tash?s:plain(s))};

  }).join('')+'</div>';

function favTabHtml(){
  ensureArrs();
  var nP=S.data.poems.filter(function(p){return p.section==='fav'}).length,nB=S.data.bayt.length,nM=canE()?0:fvList().length;
  if(!nP&&!nB&&!nM&&!canE())return '<h2 class="h">المفضلة</h2><div class="empty">لا توجد مفضلات بعد.<br><small>اضغط القلب في «شوارد» لتحفظ ما يعجبك.</small></div>';
  var segs=[];
  if(nP||canE()||(!nB&&!nM))segs.push(['poems','قصائد'+(nP?' · '+num(nP):'')]);
  if(nB||canE())segs.push(['verses','أبيات'+(nB?' · '+num(nB):'')]);
  if(nM)segs.push(['mine','أبياتي · '+num(nM)]);
  var valid=segs.some(function(s){return s[0]===S.favseg}),seg=valid?S.favseg:segs[0][0];
  var ctl=segs.length>1?'<div class="seg3'+(segs.length===2?' two':'')+'">'+segs.map(function(s){return '<button data-act="favseg" data-v="'+s[0]+'" aria-pressed="'+(seg===s[0])+'"'+(seg===s[0]?' class="on"':'')+'>'+s[1]+'</button>'}).join('')+'</div>':'<h2 class="h">المفضلة</h2>';
  if(seg==='verses')return ctl+baytHtml();
  if(seg==='mine')return ctl+mineHtml();
  var m={};S.data.poems.filter(function(p){return p.section==='fav'}).forEach(function(p){m[poetLabel(p)||'شاعر غير مذكور']=1});
  var names=Object.keys(m).sort(function(a,b){return a.localeCompare(b,'ar')});
  var prow=names.length>1?'<div class="tagrow" role="group" aria-label="الشعراء"><button class="tg" aria-pressed="'+(!S.poet)+'" data-act="clearpoet">كل الشعراء</button>'+names.map(function(n){return '<button class="tg" aria-pressed="'+(S.poet===n)+'" data-act="poet" data-poet="'+esc(n)+'">'+esc(n)+'</button>'}).join('')+'</div>':'';
  return ctl+barHtml()+prow+chipsHtml()+'<div id="listbox">'+listHtml()+'</div>';
}
function viewList(){
  var d=S.data.poems.filter(function(p){return p.section==='diwan'}).length,f=S.data.poems.length-d;
  var warn=(S.offline?'<div class="warn">أنت غير متصل بالإنترنت، تُعرض آخر نسخة محفوظة من القصائد.</div>':'')+
  (S.err?'<div class="warn">تعذر تحميل القصائد. تحقق من الاتصال بالإنترنت وأعد فتح الصفحة.</div>':'')+
  (S.mode==='local'?'<div class="warn">'+(storageOk?'الموقع غير مرتبط بقاعدة بيانات بعد (راجع ملف الإعداد)، فتُحفظ التعديلات في هذا المتصفح فقط.':'تعذر الحفظ في هذا المتصفح، فلن تبقى التعديلات بعد إغلاق الصفحة.')+'</div>':'');
  var body;
  if(S.tab==='home')body=heroHtml()+homeHtml();
  else if(S.tab==='fav')body=favTabHtml();
  else if(S.tab==='diwan'&&draftSegHtml()&&S.dseg==='draft')body=draftSegHtml()+draftsHtml();
  else body=(S.tab==='diwan'?draftSegHtml():'')+barHtml()+chipsHtml()+'<div id="listbox">'+listHtml()+'</div>';
  return mast()+warn+body+
  (canE()?'<div class="fabwrap"><div class="fab-menu"><button class="btn" data-act="add">✎ كتابة قصيدة</button><label class="btn file">⇪ رفع ملف Word<input type="file" accept=".docx" data-file="1" id="f-main"></label></div><button class="fab" data-act="fab" aria-label="إضافة" title="إضافة">+</button></div>':'');
}

function viewRead(){

  };

    document.querySelectorAll('.sq[data-act="theme"]').forEach(function(el){el.innerHTML=themeIco()});if(S.view==='more')render(true);toast(dark?'الوضع النهاري':'الوضع الليلي')
  }
  else if(a==='flclose'){closeFlash()}
  else if(a==='flnext'){flSwipe(-1)}
  else if(a==='flback'){flBack()}
  else if(a==='mineopen'){var mi=fvList()[+b.dataset.i];var mp=mi&&findP(mi.p);if(mp){S.cur=mp.id;S.view='poem';render()}}
  else if(a==='mineshare'){var ms=fvList()[+b.dataset.i];if(ms)shareVerse({id:ms.p,title:ms.title||'',poet:ms.poet||'',kind:'poem',verses:[ms.t]},ms.t)}
  else if(a==='minerm'){var ml=fvList();var mr=ml.splice(+b.dataset.i,1)[0];if(mr){LS.set('diwan-fv',ml);toast('أُزيل من أبياتي');render(true)}}
  else if(a==='flheart'){
    var fe=S.flash;if(!fe)return;
    if(!canE()){var was=fvHas(fe[0].id,fe[1]);fvToggle(fe[0],fe[1]);var now=!was;b.classList.toggle('on',now);b.setAttribute('aria-pressed',now);b.title=now?'في أبياتي':'إضافة إلى أبياتي';return}
    var ex=flFavFind(fe);
    if(ex){
      if(fe[0].kind==='bayt'||!isO()){toast(isO()?'هذا البيت في المفضلة. يُحذف من تبويب المفضلة':'البيت في المفضلة بالفعل');return}
      S.data.bayt=S.data.bayt.filter(function(x){return x.id!==ex.id});removePoem(ex.id).then(function(){toast('أُزيل من المفضلة')},fail);
      b.classList.remove('on');b.setAttribute('aria-pressed','false');return
    }
    if(S.mode==='supa'&&!S.polyExt){toast('شغّل ملف supabase-update-3.sql مرة واحدة أولًا');return}
    var nb=blank();nb.kind='bayt';nb.section='fav';nb.draft=false;nb.verses=[fe[1].slice()];
    nb.poet=poetLabel(fe[0])||S.data.settings.author||'';nb.source=fe[0].title;nb.title=fe[0].title;
    bucketPut(nb);persistPoem(nb).then(function(){toast('أُضيف إلى المفضلة')},fail);
    b.classList.add('on');b.setAttribute('aria-pressed','true');
  }
  else if(a==='flshare'){if(S.flash)shareVerse(S.flash[0],S.flash[1])}
  else if(a==='flopen'){var fp=findP(b.dataset.id);closeFlash();if(fp){S.cur=fp.id;S.view='poem';render()}}
  else if(a==='sidetoggle'){S.sideOpen=!S.sideOpen;applySide()}
  else if(a==='sidepin'){S.sidePin=!S.sidePin;S.sideOpen=!S.sidePin;LS.set('diwan-side',S.sidePin?'pin':'free');renderNav();if(S.sideOpen)sideLater(1500)}
  else if(a==='account'){if(signedIn()){S.view='account';render()}}
  else if(a==='admin'){if(S.mode!=='supa')return;if(signedIn())logout();else{S.view='login';render()}}
  else if(a==='logout'){logout()}
  else if(a==='tools'){if(!isO())return;S.view='tools';render()}
  else if(a==='fab'){document.querySelector('.fabwrap').classList.toggle('open')}
  else if(a==='aboutpoet'){S.view='poetpage';render()}
  else if(a==='stats'){if(!canE())return;S.view='stats';render()}
  else if(a==='bookview'){if(!canE())return;S.view='book';render()}
  else if(a==='bookall'){S.bookAll=b.checked;render(true)}
  else if(a==='bookprint'){window.print()}
  else if(a==='bookword'){downloadWord()}
  else if(a==='pendview'){if(!canE())return;fetchPending().then(function(){S.view='pending';render()})}
  else if(a==='like'){
    var lp=cur();if(!lp||!S.social)return;
    b.disabled=true;
    sb.rpc('toggle_like',{p_poem:lp.id,p_device:devId()}).then(function(r){
      b.disabled=false;if(r.error){toast('تعذر تسجيل الإعجاب');return}
      S.likes[lp.id]=r.data;S.mylikes[lp.id]=S.mylikes[lp.id]?0:1;render(true);
    },function(){b.disabled=false;toast('تعذر تسجيل الإعجاب')});
  }
  else if(a==='cmok'){sb.from('comments').update({approved:true}).eq('id',b.dataset.id).then(function(r){if(r.error){toast('تعذر النشر');return}toast('نُشر التعليق');if(b.dataset.from==='pend'){fetchPending().then(function(){render(true)})}else loadComments()})}
  else if(a==='cmdel'){sb.from('comments').delete().eq('id',b.dataset.id).then(function(r){if(r.error){toast('تعذر الحذف');return}toast('حُذف التعليق');if(b.dataset.from==='pend'){fetchPending().then(function(){render(true)})}else loadComments()})}
  else if(a==='resume'){var rl=LS.get('diwan-last',null);if(rl){delete SCR['poem:'+rl.id];pushPoem(rl.id);S.cur=rl.id;S.view='poem';S.focus=rl.vi>0?rl.vi:null;render()}}
  else if(a==='shownew'){if(S.onlyNew){S.onlyNew=false}else if(S.newIds.length===1){pushPoem(S.newIds[0]);S.cur=S.newIds[0];S.view='poem';S.focus=null;render();return}else{S.onlyNew=true}render(true)}
  else if(a==='dismissnew'){S.newIds=[];S.onlyNew=false;render(true)}
  else if(a==='ms'){S.ms=!S.ms;LS.set('diwan-ms',S.ms);if(S.ms)document.documentElement.dataset.ms='1';else delete document.documentElement.dataset.ms;render(true)}
  else if(a==='printpoem'){window.print()}
  else if(a==='install'){if(deferredInstall){deferredInstall.prompt();deferredInstall=null;render(true)}}
  else if(a==='iosinst'||a==='instguide'){openSheet('install')}
  else if(a==='shv'){
    if(b.dataset.vot){var r=pickVotd(false);if(r)shareVerse(r.p,r.v)}
    else{p=cur();var vv=p&&p.verses[+b.dataset.i];if(vv)shareVerse(p,vv)}
  }
  else if(a==='shclose'){var ov=$('#shov');if(ov)ov.remove()}
  else if(a==='shsz'){if((+b.dataset.d)>0){var ns=Math.min(1.6,Math.round((shScale+0.12)*100)/100);if(!cardFits(ns)){toast('أكبر حجم يناسب البطاقة');return}}shScale=Math.min(1.6,Math.max(0.6,Math.round((shScale+(+b.dataset.d)*0.12)*100)/100));try{localStorage.setItem('diwan-shsz',shScale)}catch(x){}shRedraw()}
  else if(a==='shwa'){waShare()}
  else if(a==='shtitle'||a==='shpoet'){var isT=a==='shtitle';if(isT)shTitle=!shTitle;else shPoet=!shPoet;var on=isT?shTitle:shPoet;b.setAttribute('aria-checked',on);var tg=b.querySelector('.tgl');if(tg)tg.classList.toggle('on',on);try{localStorage.setItem(isT?'diwan-shti':'diwan-shpo',on?'1':'0')}catch(x){}shRedraw()}
  else if(a==='shtheme'){shSel=+b.dataset.i;try{localStorage.setItem('diwan-shth',shSel)}catch(x){}shRedraw()}
  else if(a==='shsave'){shBlob(function(bl){var u=URL.createObjectURL(bl),l=document.createElement('a');l.href=u;l.download='bait.png';document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('تم حفظ الصورة')})}
  else if(a==='shdo'){shBlob(function(bl){
    var file=null;try{file=new File([bl],'bait.png',{type:'image/png'})}catch(x){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(function(){})}
    else{var u=URL.createObjectURL(bl),l=document.createElement('a');l.href=u;l.download='bait.png';document.body.appendChild(l);l.click();l.remove();toast('تعذرت المشاركة المباشرة، حُفظت الصورة')}
  })}
  else if(a==='setfont'){S.fi=+b.dataset.i;applyFont();try{localStorage.setItem('diwan-font',S.fi)}catch(x){}render(true)}
  else if(a==='font'){S.fi=(S.fi+1)%FONTS.length;applyFont();try{localStorage.setItem('diwan-font',S.fi)}catch(x){}toast('الخط: '+FONTS[S.fi][0]);if(S.view==='poem'||S.view==='more')render(true)}
  else if(a==='sharelink'){
    p=cur();var url=location.origin+location.pathname+pHash(p.id);
    if(navigator.share){navigator.share({title:p.title,text:p.title+(poetLabel(p)?' — '+poetLabel(p):''),url:url}).catch(function(){})}
    else{try{navigator.clipboard.writeText(url).then(function(){toast('تم نسخ رابط القصيدة')},function(){toast(url)})}catch(x){toast(url)}}
  }
  else if(a==='votd'){pickVotd(true);render(true)}
  else if(a==='fsup'||a==='fsdown'){if(a==='fsup'&&S.view==='read'){var nx=Math.round((S.fs+0.1)*10)/10;if(nx>Math.max(readerCap(),S.fs)+0.001){toast('أكبر حجم لا ينزل معه شطر إلى سطر ثانٍ');return}}S.fs=Math.min(1.6,Math.max(0.8,Math.round((S.fs+(a==='fsup'?0.1:-0.1))*10)/10));try{localStorage.setItem('diwan-fs',S.fs)}catch(x){}var vs=$('.verses')||$('#reader');if(vs)vs.style.setProperty('--fs',S.fs);if(S.view==='more')render(true)}
  else if(a==='tash'){S.tash=!S.tash;try{localStorage.setItem('diwan-tash',S.tash?'1':'0')}catch(x){}render(true)}
  else if(a==='readopen'){S.ri=0;S.dir='';S.view='read';render()}
  else if(a==='rclose'){S.view='poem';render(true)}
  else if(a==='rprev'){readStep(-1)}
  else if(a==='rnext'){readStep(1)}
  else if(a==='copypoem'){
    p=cur();
    var txt=p.title+(poetLabel(p)?'\n'+poetLabel(p):'')+'\n\n'+p.verses.map(function(v){return v[1]?v[0]+'   '+v[1]:v[0]}).join('\n');
    var ok=function(){toast('تم نسخ القصيدة')},no=function(){toast('تعذر النسخ تلقائيًا')};
    try{navigator.clipboard.writeText(txt).then(ok,no)}catch(x){no()}
  }
  else if(a==='impall'){syncImp();var sc=$('#bulk-sec').value,pt=val('bulk-poet');S.imp.forEach(function(q){q.section=sc;q.poet=pt});render(true);toast('طُبّق على كل القصائد')}
  else if(a==='photodel'){if(!isO())return;S.data.settings.photo='';var pv2=$('#s-pv');if(pv2)pv2.innerHTML=photoPv(S.data.settings);toast('اضغط «حفظ» لاعتماد الحذف')}
  else if(a==='savesettings'){if(!isO())return;S.data.settings.site=val('s-site')||'ديواني';S.data.settings.author=val('s-author');S.data.settings.bio=($('#s-bio')||{value:''}).value.trim();S.data.settings.links=parseLinks(($('#s-links')||{value:''}).value);S.view='list';render();persistSettings().then(function(){toast('تم الحفظ')},fail)}
  else if(a==='copy'){
    var ta=$('#b-out');ta.focus();ta.select();
    var done=function(){toast('تم نسخ النص')},bad=function(){toast('حدد النص يدويًا وانسخه')};
    try{navigator.clipboard.writeText(ta.value).then(done,bad)}catch(x){bad()}
  }
  else if(a==='restore'){
    var add=parseBackup($('#b-in').value);
    if(!add){toast('النص غير صالح كنسخة احتياطية');return}
    var bs=null;try{bs=JSON.parse($('#b-in').value).settings}catch(x){}
    S.view='list';render();
    addMany(add).then(function(){
      if(bs&&isO()&&!S.data.settings.author&&bs.author){S.data.settings.author=String(bs.author);return persistSettings()}
    }).then(function(){render(true);toast('أُضيفت '+num(add.length)+' قصيدة')},fail);
  }
  else if(a==='impdel'){syncImp();S.imp.splice(+b.dataset.i,1);render(true)}
  else if(a==='impsave'){
    syncImp();
    var list=S.imp.filter(function(q){return q.title&&q.verses.length}).map(function(q,k){return {id:uid(),title:q.title,poet:q.poet,section:q.section,star:false,bahr:'',qafiya:'',era:'',source:'',tags:[],occasion:'',gloss:'',verses:q.verses,created:Date.now()+k}});
    S.imp=[];S.view='list';render();
    addMany(list).then(function(){render(true);toast('أُضيفت '+num(list.length)+' قصيدة')},fail);
  }
});
function syncImp(){
  [].forEach.call(document.querySelectorAll('.imp-item'),function(el){
    var i=+el.dataset.i,p=S.imp[i];if(!p)return;
    p.title=el.querySelector('.i-title').value.trim();
    p.section=el.querySelector('.i-section').value;
    p.poet=el.querySelector('.i-poet').value.trim();
    p.verses=parseVerses(el.querySelector('.i-verses').value,'auto');p.mode=el.querySelector('.i-mode').value;
  });
}
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;renderList()}
  else if(e.target.id==='e-verses')updatePrev();
  else if(e.target.dataset&&e.target.dataset.fsr){var fv=Math.min(1.6,Math.max(0.8,(+e.target.value)/100));if(S.view==='poem'&&fv>S.fs)fv=Math.min(fv,Math.max(fitCap(),S.fs));S.fs=fv;if(+e.target.value!==Math.round(fv*100))e.target.value=Math.round(fv*100);try{localStorage.setItem('diwan-fs',fv)}catch(x){}var sp=$('#sprev');if(sp)sp.style.setProperty('--fs',fv);var vs2=$('.verses')||$('#reader');if(vs2)vs2.style.setProperty('--fs',fv);var fl=$('#fsv');if(fl)fl.textContent=num(Math.round(fv*100))+'٪'}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='bahr'){S.bahr=t.value;renderList()}
  else if(t.id==='sort'){S.sort=t.value;renderList()}
  else if(t.id==='e-mode'){updatePrev()}
  else if(t.classList&&t.classList.contains('i-mode')){var it=t.closest('.imp-item'),pi=S.imp[+it.dataset.i];if(pi){pi.mode=t.value;it.querySelector('.i-verses').value=verseText(buildVerses(pi.raw||[],t.value))}}
  else if(t.id==='s-photo'){var pf=t.files[0];if(!pf||!isO())return;readPhoto(pf,function(u){S.data.settings.photo=u;var pv=$('#s-pv');if(pv)pv.innerHTML=photoPv(S.data.settings);toast('اضغط «حفظ» لاعتماد الصورة')});t.value=''}
  else if(t.dataset&&t.dataset.file){
    var f=t.files[0];if(!f)return;
    if(!window.mammoth){toast('تعذر تحميل قارئ ملفات Word، تحقق من الاتصال');return}
    var rd=new FileReader();
    rd.onload=function(){
      window.mammoth.convertToHtml({arrayBuffer:rd.result}).then(function(res){
        var sec=S.tab==='fav'?'fav':'diwan';
        S.imp=parseDocx(res.value,f.name).map(function(p){return {title:p.title,verses:p.verses,raw:p.raw,mode:'auto',section:sec,poet:''}});
        S.msg='لم تُستخرج قصائد من الملف. تأكد أنه بصيغة docx وأن فيه نصًا.';S.view='import';render();
      },function(){toast('تعذرت قراءة الملف. تأكد أنه بصيغة docx')});
    };
    rd.readAsArrayBuffer(f);
  }
  else if(t.id==='b-file'){
    var g=t.files[0];if(!g)return;
    var r2=new FileReader();r2.onload=function(){var ta=$('#b-in');if(ta)ta.value=r2.result};r2.readAsText(g);
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id==='lf'){doLogin()}
  else if(e.target.id==='pf'){doChangePw()}
  else if(e.target.id==='ef'){e.preventDefault();doChangeEmail()}
  else if(e.target.id==='cf'){
    e.preventDefault();var body=($('#c-body').value||'').trim(),nm=($('#c-name').value||'').trim(),btn=$('#c-btn');
    if(body.length<2){toast('اكتب تعليقًا');return}
    btn.disabled=true;
    sb.rpc('add_comment',{p_poem:S.cur,p_name:nm,p_body:body,p_device:devId()}).then(function(r){
      btn.disabled=false;
      if(r.error){toast(/rate/.test(r.error.message||'')?'أرسلتَ تعليقات كثيرة، حاول لاحقًا':'تعذر إرسال التعليق');return}
      $('#c-body').value='';toast('شكرًا، سيظهر تعليقك بعد مراجعته');
    },function(){btn.disabled=false;toast('تعذر إرسال التعليق')});
  }
});
var scT=0;
window.addEventListener('scroll',function(){
  if(S.view!=='poem'||scT)return;
  scT=setTimeout(function(){
    scT=0;var els=document.querySelectorAll('.vw');if(!els.length)return;
    var mid=window.innerHeight*0.4,best=0,bd=1e9;
    els.forEach(function(el,i){var r=el.getBoundingClientRect(),d=Math.abs(r.top+r.height/2-mid);if(d<bd){bd=d;best=i}});
    saveLast(S.cur,best);
  },500);
},{passive:true});
/* reading mode: tap lower part of the screen = next verse */
document.addEventListener('click',function(e){
  if(S.view!=='read'||swiped)return;
  if(e.target.closest('button,a,input,select,.gw,#gtip'))return;
  if(!e.target.closest('#reader'))return;
  if(e.clientY>window.innerHeight*0.5){
    var p=cur();if(p&&S.ri>=p.verses.length-1)toast('نهاية القصيدة');else readStep(1)
  }else if(e.clientY>window.innerHeight*0.2&&e.clientY<=window.innerHeight*0.5){readStep(-1)}
});
/* reading mode: swipe and keys */
var tx=null,ty=0,swiped=false;
document.addEventListener('touchstart',function(e){if(S.view==='read'&&e.touches.length===1){tx=e.touches[0].clientX;ty=e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',function(e){
  if(S.view!=='read'||tx===null)return;
  var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){swiped=true;setTimeout(function(){swiped=false},400);readStep(dx>0?1:-1)}
},{passive:true});
document.addEventListener('click',function(e){if(S.sideOpen&&document.contains(e.target)&&!(e.target.closest&&e.target.closest('#bnav,#sidehandle'))){S.sideOpen=false;applySide()}});
window.addEventListener('resize',function(){applySide()});
sideHover();
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.flash)closeFlash();if(S.flash&&e.key==='ArrowLeft'){e.preventDefault();flSwipe(-1)}if(S.flash&&e.key==='ArrowRight'){e.preventDefault();flSwipe(1)}if(e.key==='Escape'&&S.sideOpen){S.sideOpen=false;applySide()}
  if(S.view!=='read')return;
  if(e.key==='ArrowLeft')readStep(1);
  else if(e.key==='ArrowRight')readStep(-1);
  else if(e.key==='Escape'){S.view='poem';render(true)}
});

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(function(r){try{r.update()}catch(e){}}).catch(function(){})});
  var hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(!hadCtl){hadCtl=true;return}try{if(sessionStorage.getItem('diwan-rl')==='1')return;sessionStorage.setItem('diwan-rl','1')}catch(e){}location.reload()})}
render();
boot();
})();
